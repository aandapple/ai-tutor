<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-репетитор — кыргызский и английский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font-head:'Albert Sans','Segoe UI',system-ui,sans-serif;
    --font-body:'Albert Sans','Segoe UI',system-ui,sans-serif;
    --navy:#16213E;
    --navy-2:#223159;
    --gold:#E3A22E;
    --gold-soft:#4A3A1C;
    --teal:#1F8A76;
    --teal-soft:#123B34;
    --coral:#E0563E;
    --coral-soft:#4A241D;
    --ink:#EDEFF2;
    --paper:#05070d;
    --card:rgba(255,255,255,0.045);
    --card-solid:#12151f;
    --border:rgba(255,255,255,0.09);
    --muted:#9AA1B2;
    --radius:14px;
    --on-gold-soft:#F7C463;
    --on-teal-soft:#6fe0c9;
    --on-coral-soft:#ff9c86;
  }
  :root[data-theme="light"]{
    --gold-soft:#F6DFB3; --teal-soft:#D7EEE9; --coral-soft:#F8DAD3;
    --ink:#1A1D29; --paper:#F4F6F5; --card:#FFFFFF; --card-solid:#FFFFFF;
    --border:#E1E4E2; --muted:#69707C;
    --on-gold-soft:#6b4a04; --on-teal-soft:#0f5c4d; --on-coral-soft:#8a2c1c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 60% 45% at 50% -8%, rgba(227,162,46,0.12), transparent 62%),
      radial-gradient(ellipse 65% 55% at 8% 105%, rgba(31,138,118,0.10), transparent 60%),
      radial-gradient(ellipse 65% 55% at 95% 15%, rgba(34,49,89,0.5), transparent 60%),
      radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      var(--paper);
    background-size:auto,auto,auto,26px 26px,auto;
    background-attachment:fixed;
    color:var(--ink); font-family:var(--font-body);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  :root[data-theme="light"] body{ background:var(--paper); }
  h1,h2,h3,h4{font-family:var(--font-head); margin:0 0 8px; color:var(--ink); font-weight:700; letter-spacing:-0.02em;}
  p{margin:0 0 10px;}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); font-size:14px;}
  a{color:inherit;}
  ::selection{background:var(--gold-soft);}
  .hidden{display:none !important;}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--border); background:var(--card-solid); color:var(--ink);
    border-radius:9px; padding:10px 16px; font-size:14px; font-weight:600;
    transition:transform .06s ease, border-color .15s ease;
  }
  .btn:hover{border-color:var(--navy-2);}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .btn-primary:hover{background:var(--navy-2); border-color:var(--navy-2);}
  .btn-gold{background:var(--gold); color:#2b1c00; border-color:var(--gold);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--border);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px; font-size:13px; border-radius:7px;}
  .btn-danger{color:var(--coral); border-color:var(--coral-soft);}
  .btn-danger:hover{background:var(--coral-soft);}

  /* ---------- Onboarding ---------- */
  #onboarding, #backend-setup, #auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-tabs{display:flex; gap:6px; margin-bottom:18px; background:var(--card-solid); border:1px solid var(--border); border-radius:10px; padding:4px;}
  .auth-tab{flex:1; padding:9px; border-radius:7px; background:transparent; border:none; font-weight:700; font-size:13.5px; color:var(--muted);}
  .auth-tab.active{background:var(--navy); color:#fff;}
  .auth-msg{margin-top:12px; padding:11px 13px; border-radius:9px; font-size:13px; line-height:1.5;}
  .auth-msg.ok{background:var(--teal-soft); color:var(--on-teal-soft);}
  .auth-msg.err{background:var(--coral-soft); color:var(--on-coral-soft);}
  .setup-code{background:var(--card-solid); border:1px solid var(--border); border-radius:9px; padding:10px 12px; font-size:12px; font-family:monospace; overflow-x:auto; white-space:pre;}
  .ob-card{
    width:100%; max-width:560px; background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:34px 32px; position:relative; overflow:hidden;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .ob-mark{position:absolute; top:-40px; right:-40px; opacity:.08; width:180px; height:180px;}
  .ob-step-label{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em; margin-bottom:4px;}
  .ob-title{font-size:24px; margin-bottom:6px;}
  .ob-sub{color:var(--muted); font-size:14px; margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
  .field input[type=text], .field input[type=number], .field input[type=email], .field input[type=password], .field input[type=tel], .field select{
    width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px;
    background:var(--card-solid); color:var(--ink); font-size:14.5px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input[type=text]:focus, .field input[type=number]:focus, .field input[type=email]:focus,
  .field input[type=password]:focus, .field input[type=tel]:focus, .field select:focus{
    outline:none; border-color:var(--navy-2); box-shadow:0 0 0 3px rgba(34,49,89,.16);
  }
  :root[data-theme="light"] .field input:focus, :root[data-theme="light"] .field select:focus{
    box-shadow:0 0 0 3px rgba(34,49,89,.10);
  }
  .field input.field-invalid{ border-color:var(--coral) !important; }
  .input-icon-wrap{ position:relative; }
  .input-icon-wrap .input-icon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    font-size:15px; opacity:.55; pointer-events:none; line-height:1;
  }
  .input-icon-wrap input{ padding-left:38px !important; }
  .input-icon-wrap.has-toggle input{ padding-right:40px !important; }
  .pass-toggle{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    background:transparent; border:none; font-size:15px; padding:6px 8px;
    cursor:pointer; opacity:.55; border-radius:6px; line-height:1;
  }
  .pass-toggle:hover{ opacity:1; background:var(--border); }
  .pw-strength-bar{ height:4px; border-radius:3px; background:var(--border); overflow:hidden; margin-top:8px; }
  .pw-strength-bar > div{ height:100%; width:0%; transition:width .2s ease, background-color .2s ease; }
  .pw-strength-label{ font-size:11.5px; margin-top:4px; color:var(--muted); }
  .field-hint{ font-size:11.5px; color:var(--muted); margin-top:5px; }
  .choice-row{display:flex; gap:8px; flex-wrap:wrap;}
  .choice-pill{
    border:1px solid var(--border); border-radius:999px; padding:9px 15px; font-size:13px;
    background:var(--card-solid); font-weight:600; color:var(--ink);
  }
  .choice-pill.selected{background:var(--navy); color:#fff; border-color:var(--navy);}
  .choice-pill[data-soon="1"]{opacity:.55;}
  .ob-progress{display:flex; gap:5px; margin-bottom:20px;}
  .ob-progress span{height:4px; flex:1; border-radius:2px; background:var(--border);}
  .ob-progress span.done{background:var(--gold);}
  .ob-actions{display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px;}

  .test-q{background:var(--card-solid); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px;}
  .test-q-meta{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .opt-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .opt-btn{
    text-align:left; padding:10px 13px; border-radius:9px; border:1px solid var(--border);
    background:var(--card-solid); font-size:14px; color:var(--ink);
  }
  .opt-btn.picked{border-color:var(--navy); background:var(--navy); color:#fff;}
  .opt-btn.correct{border-color:var(--teal); background:var(--teal-soft);}
  .opt-btn.wrong{border-color:var(--coral); background:var(--coral-soft);}

  .result-badge{
    width:96px; height:96px; border-radius:50%; background:var(--gold-soft); color:var(--on-gold-soft);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-head);
    font-size:30px; font-weight:800; margin:0 auto 14px;
  }

  /* ---------- App shell ---------- */
  #app{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
  .sidebar{
    background:var(--navy); color:#fff; padding:22px 16px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:26px; padding:0 6px;}
  .brand-mark{width:34px; height:34px; flex:none;}
  .brand-name{font-family:var(--font-head); font-weight:800; font-size:15px; line-height:1.2;}
  .brand-sub{font-size:10.5px; color:#B9C2DA; font-weight:500;}
  nav.navlist{display:flex; flex-direction:column; gap:3px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    color:#D7DCEA; font-size:13.5px; font-weight:600; background:transparent; border:none; text-align:left;
    width:100%;
  }
  .nav-item .ico{width:18px; text-align:center; font-size:15px;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:rgba(227,162,46,.16); color:var(--gold);}
  .side-stats{border-top:1px solid rgba(255,255,255,.12); margin-top:14px; padding-top:14px; font-size:12px; color:#B9C2DA; display:flex; gap:14px;}
  .side-stat b{display:block; color:#fff; font-size:15px; font-family:var(--font-head);}

  main.content{padding:30px 36px 60px; max-width:920px;}
  .page-head{margin-bottom:22px;}
  .eyebrow{font-size:12px; color:var(--muted); font-weight:700;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:640px){.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);}
  .card + .card{margin-top:14px;}

  .stat-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .stat-chip{
    flex:1; min-width:120px; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .stat-chip .num{font-family:var(--font-head); font-size:24px; font-weight:800;}
  .stat-chip .lbl{font-size:12px; color:var(--muted); font-weight:600;}

  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;}
  .badge-level{background:var(--gold-soft); color:var(--on-gold-soft);}
  .badge-done{background:var(--teal-soft); color:var(--teal);}
  .badge-progress{background:var(--border); color:var(--muted);}

  .lesson-card{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:16px 18px;}
  .lesson-card h3{font-size:15px; margin-bottom:2px;}
  .lesson-card p{font-size:12.5px; color:var(--muted); margin:0;}

  .exercise-box{margin-top:16px;}
  .fill-line{font-size:16px; line-height:1.9;}
  .fill-input{border:none; border-bottom:2px solid var(--navy); background:transparent; width:140px; font-size:16px; padding:2px 4px; color:var(--ink); font-weight:700;}
  .match-cols{display:flex; gap:24px; margin-top:10px;}
  .match-col{flex:1; display:flex; flex-direction:column; gap:8px;}
  .match-item{padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--card-solid); cursor:grab;}
  .match-item.sel{border-color:var(--gold); background:var(--gold-soft);}
  .match-item.paired{border-color:var(--teal); background:var(--teal-soft);}
  .match-item.drag-over{border-color:var(--gold); box-shadow:inset 0 0 0 2px var(--gold);}
  .pron-detail{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .pron-chip{padding:3px 9px; border-radius:999px; font-size:12.5px; font-weight:600;}
  .pron-ok{background:var(--teal-soft); color:var(--on-teal-soft);}
  .pron-bad{background:var(--coral-soft); color:var(--on-coral-soft);}
  .feedback-box{margin-top:14px; padding:13px 15px; border-radius:10px; font-size:13.5px;}
  .feedback-ok{background:var(--teal-soft); color:var(--on-teal-soft);}
  .feedback-bad{background:var(--coral-soft); color:var(--on-coral-soft);}
  .ai-inline{margin-top:10px; font-size:13px; color:var(--muted); font-style:italic;}

  .progress-track{height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin:8px 0 16px;}
  .progress-fill{height:100%; background:var(--gold);}

  /* Chat */
  .chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 150px); background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);}
  .chat-log{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px;}
  .msg{max-width:78%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5;}
  .msg-ai{align-self:flex-start; background:var(--card-solid); border:1px solid var(--border); border-bottom-left-radius:4px;}
  .msg-user{align-self:flex-end; background:var(--navy); color:#fff; border-bottom-right-radius:4px;}
  .msg-meta{font-size:10.5px; color:var(--muted); margin-bottom:3px; font-weight:700;}
  .chat-input-row{display:flex; gap:8px; padding:14px; border-top:1px solid var(--border);}
  .chat-input-row input{flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card-solid); color:var(--ink);}
  .typing{display:inline-flex; gap:3px; align-items:center;}
  .typing span{width:5px; height:5px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}
  @keyframes scaleIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
  .animate-scale-in{animation:scaleIn .6s cubic-bezier(.16,1,.3,1) both;}

  /* Vocab */
  .vocab-row{display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--border); font-size:14px;}
  .vocab-row:last-child{border-bottom:none;}
  .box-dot{display:inline-flex; gap:3px;}
  .box-dot i{width:6px; height:6px; border-radius:50%; background:var(--border); display:inline-block;}
  .box-dot i.on{background:var(--teal);}
  .flash-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:50px 30px;
    text-align:center; min-height:180px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-size:26px; font-weight:800; cursor:pointer;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .rate-row{display:flex; gap:8px; margin-top:16px;}
  .rate-row .btn{flex:1;}

  /* Progress calendar */
  .cal-grid{display:grid; grid-template-columns:repeat(14,1fr); gap:4px; margin-top:10px;}
  .cal-cell{aspect-ratio:1; border-radius:3px; background:var(--border);}
  .cal-cell.on{background:var(--teal);}

  /* Динамика ошибок (п.5.9 ТЗ) — простой столбчатый тренд по дням */
  .trend-row{display:flex; align-items:flex-end; gap:3px; height:56px; margin-top:10px;}
  .trend-bar{flex:1; background:var(--coral-soft); border-radius:3px 3px 0 0; min-height:3px; position:relative;}
  .trend-bar.empty{background:var(--border);}
  .skill-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .skill-row:last-child{border-bottom:none;}
  .skill-bar-track{flex:1; height:6px; background:var(--border); border-radius:4px; margin:0 10px; overflow:hidden;}
  .skill-bar-fill{height:100%; background:var(--teal);}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--navy); color:#fff; padding:13px 18px;
    border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.2);
    display:flex; align-items:center; gap:10px; z-index:50; transform:translateY(20px); opacity:0;
    transition:all .25s ease; pointer-events:none;
  }
  .toast.show{transform:translateY(0); opacity:1;}

  select.lang-select{background:var(--card-solid); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--ink);}

  .switch{position:relative; display:inline-block; width:40px; height:22px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--border); border-radius:22px; transition:.15s;}
  .slider:before{content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
  input:checked + .slider{background:var(--teal);}
  input:checked + .slider:before{transform:translateX(18px);}

  @media (max-width:760px){
    #app{grid-template-columns:1fr; grid-template-rows:auto 1fr;}
    .sidebar{position:sticky; top:0; height:auto; flex-direction:row; align-items:center; overflow-x:auto; padding:12px;}
    .brand{margin-bottom:0; margin-right:10px;}
    .brand-sub{display:none;}
    nav.navlist{flex-direction:row; flex:none;}
    .nav-item{white-space:nowrap;}
    .side-stats{display:none;}
    main.content{padding:18px 16px 48px;}
    .match-cols{gap:12px;}
  }
</style>
</head>
<body>

<!-- ================= BACKEND SETUP (Supabase URL/ключ) ================= -->
<div id="backend-setup" class="hidden">
  <div class="ob-card">
    <div id="backend-setup-content"></div>
  </div>
</div>

<!-- ================= AUTH (регистрация/вход по e-mail, п.5.1 ТЗ) ================= -->
<div id="auth-screen" class="hidden">
  <div class="ob-card">
    <div id="auth-content"></div>
  </div>
</div>

<!-- ================= ONBOARDING ================= -->
<div id="onboarding" class="hidden">
  <div class="ob-card">
    <svg class="ob-mark" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="8"/>
      <path d="M50 4 L50 16 M50 84 L50 96 M4 50 L16 50 M84 50 L96 50 M17 17 L25 25 M75 75 L83 83 M17 83 L25 75 M75 25 L83 17"/>
    </g></svg>
    <div id="ob-content"></div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100"><g fill="none" stroke="#E3A22E" stroke-width="6">
        <circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="14"/>
        <path d="M50 2 L50 20 M50 80 L50 98 M2 50 L20 50 M80 50 L98 50"/>
      </g></svg>
      <div>
        <div class="brand-name">ИИ-репетитор</div>
        <div class="brand-sub" id="brand-sub">кыргызский · английский</div>
      </div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="side-stats">
      <div class="side-stat"><b id="side-xp">0</b>XP</div>
      <div class="side-stat"><b id="side-streak">0</b>дней подряд</div>
    </div>
  </aside>
  <main class="content" id="main-content"></main>
</div>

<div class="toast" id="toast"></div>

<!-- Клиент Supabase (п.5.1 ТЗ — реальная регистрация/вход по e-mail с настоящим
     бэкендом, а не локальной имитацией). Anon-ключ Supabase рассчитан на то,
     чтобы быть публичным на клиенте — доступ к данным ограничивается Row Level
     Security-политиками на стороне Supabase, а не секретностью ключа. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   I18N — интерфейс: русский / кыргызский / английский (п.1 ТЗ)
   Переведён костяк интерфейса; полная локализация контента уроков —
   отдельная задача для методистов на следующих этапах.
============================================================ */
const I18N = {

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
let sbSyncTimer = null;
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* хранилище недоступно — работаем в памяти */ }
  // Синхронизация с Supabase (п.5.1 ТЗ): если пользователь вошёл по e-mail,
  // его данные дублируются на сервер, чтобы прогресс не терялся при смене
  // устройства/браузера. Если бэкенд не настроен или сессии нет — просто
  // работаем локально, как и раньше.
  if(sbClient && state.userId){
    clearTimeout(sbSyncTimer);
    sbSyncTimer = setTimeout(()=>{ syncStateToSupabase(); }, 900);
  }
}
async function syncStateToSupabase(){
  if(!sbClient || !state.userId) return;
  try{
    const { error } = await sbClient.from("app_state").upsert({
      user_id: state.userId, data: state, updated_at: new Date().toISOString()
    });
    if(error) console.error("Supabase: не удалось сохранить прогресс на сервере —", error.message);
  }catch(e){ console.error("Supabase: ошибка синхронизации —", e.message||e); }
}

============================================================ */

// к данным ограничивается Row Level Security-политиками в самом Supabase, а
// не секретностью ключа (см. supabase-setup.sql).
const DEFAULT_SUPABASE_URL = "https://yxuqhlugvkjeoyealoum.supabase.co";
const DEFAULT_SUPABASE_ANON_KEY = "sb_publishable_uivL0QYLB81L1Opt5WV-oQ_fkhrB4NV";
function loadSbConfig(){
  try{
    const raw = localStorage.getItem(SB_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore */ }
  if(DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY){
    return { url: DEFAULT_SUPABASE_URL, anonKey: DEFAULT_SUPABASE_ANON_KEY };
  }

function saveSbConfig(cfg){

/* ============================================================
   ИИ-ДИАЛОГ (п.5.5/5.8 ТЗ) — модель Google Gemini напрямую с клиента.
   Изначально этот же чат работал через claude.use("sample") — встроенную
   в claude.ai-артефакты функцию сэмплинга. Она доступна ТОЛЬКО пока
   страница открыта по ссылке артефакта claude.ai; на самостоятельном
   хостинге (GitHub Pages/Netlify) и в Android-приложении её просто нет
   в браузере, поэтому диалог с ИИ там не работал вовсе. Здесь — прямой
   вызов бесплатного Gemini API, который работает где угодно.
   Честное ограничение: ключ ниже виден любому в исходном коде страницы —
   в отличие от anon-ключа Supabase, это НЕ предназначено для широкой
   публикации (см. пояснение в переписке); для приватного учебного показа
   это приемлемо, для настоящего продукта потребовался бы сервер-прокси,
   прячущий ключ (например, Supabase Edge Function).
============================================================ */
const GEMINI_API_KEY = "AQ.Ab8RN6IE1taX87qb9bbk5gFS_tDzYW5bgbNkVBjvpQS91BdDqA";
const GEMINI_MODEL = "gemini-2.0-flash";
async function geminiGenerate(systemText, turns){
  if(!GEMINI_API_KEY){
    const err = new Error("Gemini API-ключ не настроен");
    err.noKey = true;
    throw err;
  }
  const contents = turns.map(m=>({
    role: m.role==="assistant" ? "model" : "user",
    parts: [{ text: m.content }]
  }));
  const body = { contents, generationConfig: { temperature: 0.7, maxOutputTokens: 500 } };
  if(systemText) body.systemInstruction = { parts: [{ text: systemText }] };
  const resp = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
    { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) }
  );
  if(!resp.ok){
    let detail = "";
    try{ const j = await resp.json(); detail = (j && j.error && j.error.message) || ""; }catch(e){ /* ignore */ }
    const err = new Error("Gemini API error " + resp.status + (detail ? ": " + detail : ""));
    err.status = resp.status;
    throw err;
  }
  const data = await resp.json();
  const cand = data && data.candidates && data.candidates[0];
  const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||"").join("") : "";
  if(!text){
    const err = new Error("Gemini: пустой ответ (возможно, сработал фильтр безопасности)");
    err.empty = true;
    throw err;
  }
  return text;
}
function aiErrorMessage(e){
  if(e && e.noKey) return "ИИ-диалог пока не настроен (не хватает API-ключа).";
  if(e && e.status===429) return "Слишком много запросов — попробуйте чуть позже.";
  if(e && (e.status===400 || e.status===403)) return "ИИ не смог ответить на это сообщение.";
  return "Произошла ошибка связи с ИИ.";
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function markActivity(){
  const d = todayStr();
  state.activity[d] = true;
  const last = state.streak.last;
  if(last !== d){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    state.streak.count = (last === y) ? state.streak.count+1 : 1;
    state.streak.last = d;
  }
  saveState();
}
function addXP(n){
  state.xp += n;
  const d = todayStr();
  state.dailyXp[d] = (state.dailyXp[d]||0) + n;
  trackStudyTime();
  markActivity(); checkBadges(); saveState(); renderSidebar();
}
// Приблизительное "время занятий" (п.5.9 ТЗ): накапливает реальное прошедшее
// время между действиями в уроках/диалоге/повторении, но не более 3 минут за
// один "прыжок" — иначе открытая, но неактивная вкладка накручивала бы часы.
function trackStudyTime(){
  const now = Date.now();
  if(state.lastActivityTs){
    const gapMin = (now - state.lastActivityTs) / 60000;
    state.studyMinutes = (state.studyMinutes||0) + Math.max(0, Math.min(gapMin, 3));
  }
  state.lastActivityTs = now;
}
// Суммарная точность по типу упражнения (п.5.9 ТЗ: "% усвоения грамматики" и
// аналогичные показатели по другим темам банка упражнений, п.5.7 ТЗ).
function recordSkillAttempt(type, correct){
  if(!type) return;
  if(!state.skillStats[type]) state.skillStats[type] = {correct:0, total:0};
  state.skillStats[type].total++;
  if(correct) state.skillStats[type].correct++;
}

/* ============================================================
   НАПОМИНАНИЯ (п.5.11 ТЗ): «Push-уведомления о необходимости
   позаниматься» и «напоминания о повторении слов».
   Честное ограничение: браузерный Notification API работает только
   пока вкладка/приложение открыты в этом браузере — настоящий push,
   когда приложение закрыто, требует сервера и service worker (см. п.8
   ТЗ про инфраструктурные ограничения), поэтому здесь не имитируется.
============================================================ */
function maybeShowStudyReminder(){
  if(!state.profile.notifications) return;
  if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const today = todayStr();
  if(state.lastReminderDate === today) return; // не чаще одного напоминания в день
  const dueWords = state.vocab.filter(v=>v.nextReview<=today).length;
  let body = null;
  if(dueWords>0){
    body = `${dueWords} слов${dueWords===1?"о":""} в вашем словаре ждут повторения.`;
  }else if(state.streak.last !== today){
    body = "Не забудьте позаниматься сегодня, чтобы не потерять серию!";
  }
  if(body){
    try{
      new Notification("ИИ-репетитор", { body, tag:"aitutor-reminder" });
      state.lastReminderDate = today;
      saveState();
    }catch(e){ /* уведомления недоступны в этом окружении — тихо пропускаем */ }
  }
}
function checkBadges(){
  const has = id => state.badges.includes(id);
  const give = id => { if(!has(id)){ state.badges.push(id); toast("🏅 Новый значок открыт!"); } };
  const doneCount = Object.values(state.lessonsProgress).filter(l=>l.status==="done").length;
  if(doneCount>=1) give("first_lesson");
  if(state.streak.count>=3) give("streak3");
  if(state.streak.count>=7) give("streak7");
  if(state.vocab.length>=20) give("vocab20");
  if(state.dialogue.length>=2 || (state.dialogueKy&&state.dialogueKy.length>=2)) give("first_dialogue");
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2600);
}

/* ============================================================
   ЭКРАН «ВХОД / РЕГИСТРАЦИЯ ПО E-MAIL» (п.5.1 ТЗ).
   Настоящая регистрация через Supabase Auth: signUp/signInWithPassword.
   При регистрации Supabase по умолчанию отправляет письмо со ссылкой
   для подтверждения на указанный e-mail — это не имитация, а реальное
   письмо от сервиса.
============================================================ */
let authTab = "login"; // "login" | "signup"
const EMAIL_RX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

/* Базовая проверка сложности пароля — только для НОВОГО пароля при
   регистрации (существующие логины не должны ломаться из-за задним
   числом ужесточённых правил). Возвращает список того, чего не хватает. */
function passwordIssues(pass){
  const issues = [];
  if(pass.length<8) issues.push("минимум 8 символов");
  if(!/[a-zA-Zа-яА-ЯёЁ]/.test(pass)) issues.push("хотя бы одна буква");
  if(!/[0-9]/.test(pass)) issues.push("хотя бы одна цифра");
  return issues;
}
function passwordStrengthScore(pass){
  if(!pass) return 0;
  let score = 0;
  if(pass.length>=8) score++;
  if(pass.length>=12) score++;
  if(/[a-zа-яё]/.test(pass) && /[A-ZА-ЯЁ]/.test(pass)) score++;
  if(/[0-9]/.test(pass)) score++;
  if(/[^a-zA-Zа-яА-ЯёЁ0-9]/.test(pass)) score++;
  return Math.min(score, 4);
}
function renderPwStrength(pass){
  const bar = document.getElementById("pw-strength-fill");
  const label = document.getElementById("pw-strength-label");
  if(!bar || !label) return;
  const score = passwordStrengthScore(pass);
  const steps = [
    {w:"0%", c:"var(--border)", t:""},
    {w:"25%", c:"var(--coral)", t:"Слабый пароль"},
    {w:"50%", c:"var(--gold)", t:"Средний пароль"},
    {w:"75%", c:"var(--teal)", t:"Хороший пароль"},
    {w:"100%", c:"var(--teal)", t:"Отличный пароль"}
  ][score];
  bar.style.width = steps.w; bar.style.background = steps.c;
  label.textContent = pass ? steps.t : "";
}

async function doAuthSubmit(){
  const emailInput = document.getElementById("auth-email");
  const passInput = document.getElementById("auth-pass");
  const email = emailInput.value.trim();
  const pass = passInput.value;
  const msgBox = document.getElementById("auth-msg");
  emailInput.classList.remove("field-invalid");
  passInput.classList.remove("field-invalid");

  // Проверка заполненности и формата — до обращения к Supabase.
  if(!email){
    emailInput.classList.add("field-invalid");
    msgBox.innerHTML = `<div class="auth-msg err">Введите e-mail.</div>`;
    return;
  }
  if(!EMAIL_RX.test(email)){
    emailInput.classList.add("field-invalid");
    msgBox.innerHTML = `<div class="auth-msg err">Проверьте формат e-mail (например, you@example.com).</div>`;
    return;
  }
  if(!pass){
    passInput.classList.add("field-invalid");
    msgBox.innerHTML = `<div class="auth-msg err">Введите пароль.</div>`;
    return;
  }
  // Проверку сложности применяем только к НОВОМУ паролю при регистрации —
  // для входа достаточно, чтобы поле было не пустым.
  if(authTab==="signup"){
    const issues = passwordIssues(pass);
    if(issues.length){
      passInput.classList.add("field-invalid");
      msgBox.innerHTML = `<div class="auth-msg err">Пароль слишком простой — нужно: ${issues.join(", ")}.</div>`;
      return;
    }
  }

  msgBox.innerHTML = `<div class="auth-msg">Проверяем…</div>`;
  try{
    if(authTab==="signup"){
      const { data, error } = await sbClient.auth.signUp({ email, password: pass });
      if(error) throw error;
      if(data && data.user && !data.session){
        renderAuthScreen(`<div class="auth-msg ok">Письмо со ссылкой для подтверждения отправлено на ${escHtml(email)}. Перейдите по ссылке из письма, затем войдите на вкладке «Войти».</div>`);
        authTab = "login";
      }else if(data && data.session){
        await afterLogin(data.session.user);
      }
    }else{
      const { data, error } = await sbClient.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
      await afterLogin(data.user);
    }
  }catch(e){
    msgBox.innerHTML = `<div class="auth-msg err">${escHtml(translateAuthError(e.message))}</div>`;
  }
}
async function doPasswordReset(){
  const email = document.getElementById("auth-email").value.trim();
  const msgBox = document.getElementById("auth-msg");
  if(!email){ msgBox.innerHTML = `<div class="auth-msg err">Сначала введите e-mail, на который выслать ссылку для сброса пароля.</div>`; return; }
  try{
    const { error } = await sbClient.auth.resetPasswordForEmail(email);
    if(error) throw error;
    msgBox.innerHTML = `<div class="auth-msg ok">Письмо для сброса пароля отправлено на ${escHtml(email)}.</div>`;
  }catch(e){
    msgBox.innerHTML = `<div class="auth-msg err">${escHtml(translateAuthError(e.message))}</div>`;
  }
}
function translateAuthError(msg){
  const m = (msg||"").toLowerCase();
  if(m.includes("already registered") || m.includes("already exists")) return "Пользователь с таким e-mail уже зарегистрирован — попробуйте войти.";
  if(m.includes("invalid login credentials")) return "Неверный e-mail или пароль.";
  if(m.includes("email not confirmed")) return "Email ещё не подтверждён — перейдите по ссылке из письма.";
  if(m.includes("password") && m.includes("6")) return "Пароль слишком короткий (минимум 6 символов).";
  return msg || "Не удалось выполнить операцию — попробуйте ещё раз.";
}

/* Загрузка/слияние состояния после успешного входа: если у пользователя
   уже есть сохранённые данные на сервере (п.5.1/5.9 ТЗ — профиль и прогресс
   не теряются при смене устройства), подтягиваем их поверх локальных. */
async function afterLogin(user){
  document.getElementById("auth-screen").classList.add("hidden");
  try{
    const { data, error } = await sbClient.from("app_state").select("data").eq("user_id", user.id).maybeSingle();
    if(error) throw error;
    if(data && data.data){
      state = Object.assign(defaultState(), data.data);
    }
  }catch(e){
    console.error("Supabase: не удалось загрузить сохранённые данные —", e.message||e);
  }
  state.userId = user.id;
  state.userEmail = user.email;
  saveState();
  if(state.onboardingDone){
    document.getElementById("app").classList.remove("hidden");
    renderApp();
    maybeShowStudyReminder();
  }else{
    document.getElementById("onboarding").classList.remove("hidden");
    renderOnboarding();
  }
}
async function logout(){
  try{ if(sbClient) await sbClient.auth.signOut(); }catch(e){ /* ignore */ }
  location.reload();
}

/* Определяет, какой из трёх экранов показать при загрузке: настройка
   бэкенда → вход/регистрация → онбординг/приложение. */
async function bootAuthFlow(){
  const cfg = loadSbConfig();
  if(!cfg){
    document.getElementById("backend-setup").classList.remove("hidden");
    renderBackendSetup();
    return;
  }
  if(!sbClient) initSupabaseClient();
  if(!sbClient){
    document.getElementById("backend-setup").classList.remove("hidden");
    renderBackendSetup();
    return;
  }
  try{
    const { data:{ session } } = await sbClient.auth.getSession();
    if(session && session.user){
      await afterLogin(session.user);
      return;
    }
  }catch(e){ console.error("Supabase: ошибка проверки сессии —", e.message||e); }
  document.getElementById("auth-screen").classList.remove("hidden");
  renderAuthScreen();
}

/* ============================================================
   ONBOARDING FLOW
   Порядок шагов зависит от выбора языка на шаге "profile" —
   кыргызский/английский/оба (п.5.1 ТЗ). Для английского проходит
   CEFR-тест (п.5.2), для кыргызского — самооценка по отдельной
   шкале (п.5.2, KY_LEVELS выше).
============================================================ */
let obStage = "welcome";
let obData = { name:"", age:"", goal:"", targetLangs:["en"], testAnswers:{} };
function obPlan(){
  const steps = ["welcome","profile"];
  if(obData.targetLangs.includes("en")) steps.push("testintro","test");
  if(obData.targetLangs.includes("ky")) steps.push("kylevel");
  steps.push("result");
  return steps;
}
function obGoNext(fromStage){
  const plan = obPlan();
  const idx = plan.indexOf(fromStage);
  obStage = plan[idx+1] || "result";
  renderOnboarding();
}
function obGoBack(fromStage){
  const plan = obPlan();
  const idx = plan.indexOf(fromStage);
  obStage = idx>0 ? plan[idx-1] : "welcome";
  renderOnboarding();
}

    <ellipse cx="100" cy="205" rx="46" ry="8" fill="#000" opacity="0.15"/>

    <ellipse cx="65" cy="120" rx="16" ry="34" fill="#16213E" transform="rotate(-18 65 120)"/>
    <ellipse cx="135" cy="120" rx="16" ry="34" fill="#16213E" transform="rotate(18 135 120)"/>
    <circle cx="82" cy="90" r="8" fill="#fff"/>
    <circle cx="118" cy="90" r="8" fill="#fff"/>
    <circle cx="84" cy="92" r="4" fill="#16213E"/>
    <circle cx="116" cy="92" r="4" fill="#16213E"/>
    <path d="M92 102 L108 102 L100 114 Z" fill="#E3A22E"/>
    <ellipse cx="78" cy="196" rx="13" ry="7" fill="#E3A22E"/>
    <ellipse cx="122" cy="196" rx="13" ry="7" fill="#E3A22E"/>

}

function renderOnboarding(){
  const root = document.getElementById("ob-content");
  const plan = obPlan(); // зависит от obData.targetLangs, пересчитывается каждый рендер
  const stepIdx = plan.indexOf(obStage);
  const totalSteps = plan.length - 2; // без welcome и result
  const progress = `<div class="ob-progress">${plan.slice(0,-1).map((s,i)=>`<span class="${i<=stepIdx?'done':''}"></span>`).join("")}</div>`;
  const stepLabel = `ШАГ ${Math.max(stepIdx,1)} ИЗ ${totalSteps}`;

  if(obStage==="welcome"){
    root.innerHTML = `
      <div style="text-align:center;margin-bottom:6px;" class="animate-scale-in">${penguinSVG(110)}</div>
      <div class="ob-step-label" style="text-align:center;">ДОБРО ПОЖАЛОВАТЬ</div>
      <h2 class="ob-title" style="text-align:center;">ИИ-репетитор кыргызского и английского языков</h2>
      <p class="ob-sub" style="text-align:center;">Пройдите короткую регистрацию и входной тест — и Mr. Penguin построит для вас индивидуальный план обучения.</p>
      <div class="ob-actions"><span></span><button class="btn btn-primary" id="ob-next">Начать →</button></div>`;
    document.getElementById("ob-next").onclick=()=>{ obStage="profile"; renderOnboarding(); };
    return;
  }

  if(obStage==="profile"){
    root.innerHTML = `
      ${progress}
      <div class="ob-step-label">${stepLabel}</div>
      <h2 class="ob-title">Расскажите о себе</h2>
      <div class="field"><label>Имя</label><input type="text" id="f-name" value="${obData.name}" placeholder="Например, Айгерим"></div>
      <div class="field"><label>Возраст</label><input type="number" id="f-age" value="${obData.age}" placeholder="Например, 21"></div>
      <div class="field"><label>Цель изучения языка</label>
        <select id="f-goal">
          <option value="travel">Разговорный язык для путешествий</option>
          <option value="work">Язык для работы</option>
          <option value="exam">Подготовка к экзамену</option>
          <option value="general">Общее развитие</option>
        </select>
      </div>
      <div class="field"><label>Какой язык изучаем?</label>
        <div class="choice-row">
          <button class="choice-pill ${obData.targetLangs.includes('en')?'selected':''}" data-lang="en">Английский</button>
          <button class="choice-pill ${obData.targetLangs.includes('ky')?'selected':''}" data-lang="ky">Кыргызский (текст)</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-top:6px;">Можно выбрать оба языка сразу — переключаться между ними можно в любой момент.</p>
      </div>
      <div id="profile-step-err"></div>
      <div class="ob-actions">
        <button class="btn btn-ghost" id="ob-back">← Назад</button>
        <button class="btn btn-primary" id="ob-next2">Далее →</button>
      </div>`;
    document.querySelectorAll(".choice-pill").forEach(p=>{
      p.onclick=()=>{
        const isSelected = p.classList.contains("selected");
        if(isSelected){
          const selectedCount = document.querySelectorAll(".choice-pill.selected").length;
          if(selectedCount<=1){ toast("Выберите хотя бы один язык"); return; }
        }
        p.classList.toggle("selected");
      };
    });
    document.getElementById("ob-back").onclick=()=>{ obStage="welcome"; renderOnboarding(); };
    document.getElementById("ob-next2").onclick=()=>{
      // Проверка заполненности профиля (п.5.1 ТЗ — имя, возраст обязательны).
      const nameInput = document.getElementById("f-name");
      const ageInput = document.getElementById("f-age");
      const errBox = document.getElementById("profile-step-err");
      nameInput.classList.remove("field-invalid"); ageInput.classList.remove("field-invalid");
      const nameVal = nameInput.value.trim();
      const ageVal = ageInput.value.trim();
      const ageNum = parseInt(ageVal, 10);
      if(!nameVal){
        nameInput.classList.add("field-invalid");
        errBox.innerHTML = `<div class="auth-msg err">Введите имя.</div>`;
        return;
      }
      if(!ageVal || isNaN(ageNum) || ageNum<5 || ageNum>100){
        ageInput.classList.add("field-invalid");
        errBox.innerHTML = `<div class="auth-msg err">Введите корректный возраст (от 5 до 100 лет).</div>`;
        return;
      }
      obData.name = nameVal;
      obData.age = ageVal;
      obData.goal = document.getElementById("f-goal").value;
      const picked = [...document.querySelectorAll(".choice-pill.selected")].map(p=>p.dataset.lang);
      obData.targetLangs = picked.length ? picked : ["en"];
      obGoNext("profile");
    };
    return;
  }

  if(obStage==="testintro"){
    root.innerHTML = `
      ${progress}
      <div class="ob-step-label">${stepLabel}</div>
      <h2 class="ob-title">Входная диагностика (английский)</h2>
      <p class="ob-sub">${ENTRY_TEST.length} коротких вопросов на грамматику, лексику, аудирование и чтение — определим ваш уровень по шкале CEFR (A1–C1). Либо начните «с нуля», если раньше английский не изучали.</p>
      <div class="ob-actions">
        <button class="btn" id="ob-scratch">Начинаю с нуля</button>
        <button class="btn btn-primary" id="ob-starttest">Пройти тест →</button>
      </div>`;
    document.getElementById("ob-scratch").onclick=()=>{
      // "Начинаю с нуля" должно пропускать сам тест (не просто перейти на
      // следующий шаг плана, которым всегда является "test"), иначе тест
      // сразу же перезапишет только что выбранный уровень A1.
      state.level="A1"; state.levelSource="с нуля";
      const plan = obPlan();
      const testIdx = plan.indexOf("test");
      obStage = testIdx>=0 ? (plan[testIdx+1] || "result") : (plan[plan.indexOf("testintro")+1] || "result");
      renderOnboarding();
    };
    document.getElementById("ob-starttest").onclick=()=>{ obData.testAnswers={}; obData.testIdx=0; obStage="test"; renderOnboarding(); };
    return;
  }

  if(obStage==="test"){
    const i = obData.testIdx||0;
    const q = ENTRY_TEST[i];
    const bodyExtra = q.type==="reading"
      ? `<div class="card" style="margin-bottom:14px;background:var(--card-solid);"><p style="margin:0;font-size:14px;line-height:1.6;">${q.passage}</p></div>`
      : q.type==="listening"
      ? `<button class="btn btn-primary btn-sm" id="test-speak-btn" data-text="${escAttr(q.audioText)}" style="margin-bottom:14px;">🔊 Прослушать фразу</button>`
      : "";
    root.innerHTML = `
      <div class="ob-step-label">ВОПРОС ${i+1} ИЗ ${ENTRY_TEST.length}</div>
      <div class="ob-progress">${ENTRY_TEST.map((_,idx)=>`<span class="${idx<i?'done':''}"></span>`).join("")}</div>
      <div class="test-q">
        <div class="test-q-meta">${q.type==="reading"?"Чтение":q.type==="listening"?"Аудирование":"Грамматика/лексика"} · уровень ориентировочно ${q.level}</div>
        ${bodyExtra}
        <div style="font-size:16px;font-weight:600;">${q.q}</div>
        <div class="opt-list">${q.opts.map((o,oi)=>`<button class="opt-btn" data-oi="${oi}">${o}</button>`).join("")}</div>
      </div>`;
    const speakBtn = document.getElementById("test-speak-btn");
    if(speakBtn) speakBtn.onclick = () => speak(speakBtn.dataset.text);
    root.querySelectorAll(".opt-btn").forEach(b=>{
      b.onclick=()=>{
        obData.testAnswers[i] = parseInt(b.dataset.oi,10);
        obData.testIdx = i+1;
        if(obData.testIdx >= ENTRY_TEST.length){
          let score=0;
          ENTRY_TEST.forEach((qq,idx)=>{ if(obData.testAnswers[idx]===qq.a) score+=qq.w; });
          state.entryScore = score;
          state.level = levelFromScore(score);
          state.levelSource = "тест";
          obGoNext("test");
        }else{
          renderOnboarding();
        }
      };
    });
    return;
  }

  if(obStage==="kylevel"){
    root.innerHTML = `
      ${progress}
      <div class="ob-step-label">${stepLabel}</div>
      <h2 class="ob-title">Ваш уровень кыргызского</h2>
      <p class="ob-sub">Отдельная шкала для кыргызского (полноценный тест — задача следующих этапов). Оцените себя честно — от этого зависит, с чего начнём.</p>
      <div class="choice-row" style="flex-direction:column;align-items:stretch;">
        ${KY_LEVELS.map(lv=>`<button class="choice-pill" data-action-ob="pick-ky-level" data-level="${lv.id}" style="text-align:left;">${lv.label}</button>`).join("")}
      </div>
      <div class="ob-actions"><button class="btn btn-ghost" id="ob-back-ky">← Назад</button><span></span></div>`;
    root.querySelectorAll('[data-action-ob="pick-ky-level"]').forEach(b=>{
      b.onclick=()=>{ state.kyLevel = b.dataset.level; obGoNext("kylevel"); };
    });
    document.getElementById("ob-back-ky").onclick=()=>{ obGoBack("kylevel"); };
    return;
  }

  if(obStage==="result"){
    const hasEn = obData.targetLangs.includes("en");
    const hasKy = obData.targetLangs.includes("ky");
    const weekly = hasEn ? (state.level==="A1"||state.level==="A2" ? 4 : 3) : (state.kyLevel==="none"||state.kyLevel==="basic" ? 4 : 3);
    const levelLine = [
      hasEn ? `английский: ${state.level}` : null,
      hasKy ? `кыргызский: ${kyLevelLabel(state.kyLevel)}` : null
    ].filter(Boolean).join(" · ");
    root.innerHTML = `
      ${progress}
      <div class="ob-step-label">ГОТОВО</div>
      <div class="result-badge">${hasEn ? state.level : "🇰🇬"}</div>
      <h2 class="ob-title" style="text-align:center;">Ваш уровень: ${levelLine}</h2>
      <p class="ob-sub" style="text-align:center;">${hasEn ? (state.levelSource==="тест" ? "Английский определён по результатам входного теста." : "Английский — вы начинаете с нуля, курс подобран для уровня A1.") : "План подобран под вашу самооценку по кыргызскому."}</p>
      <div class="card" style="margin-bottom:18px;">
        <b>Персональный план</b>
        <p style="margin-top:8px;font-size:13.5px;color:var(--muted);">Цель: ${goalLabel(obData.goal)} · ${weekly} урока(ов) в неделю · языки: ${hasEn&&hasKy?"английский и кыргызский":hasEn?"английский":"кыргызский"}</p>
      </div>
      <button class="btn btn-primary btn-block" id="ob-finish">Начать обучение →</button>`;
    document.getElementById("ob-finish").onclick=()=>{
      state.profile.name = obData.name; state.profile.age = obData.age; state.profile.goal = obData.goal;
      state.profile.targetLangs = obData.targetLangs.slice();
      state.onboardingDone = true;
      state.weeklyLessons = weekly;
      markActivity(); saveState();
      document.getElementById("onboarding").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      currentView="home"; renderApp();
    };
    return;
  }
}
function goalLabel(g){
  return {travel:"разговорный язык для путешествий", work:"язык для работы", exam:"подготовка к экзамену", general:"общее развитие"}[g] || "общее развитие";
}
