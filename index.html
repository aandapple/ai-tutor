   APP NAV / ROUTER
============================================================ */
let currentView = "home";
let ui = { lessonId:null, exIdx:0, exState:{}, reviewQueue:[], reviewIdx:0, flashRevealed:false, correctCount:0, xpEarned:0, lessonLangFilter:"en", adminTab:"content", miniTestIdx:0, miniTestCorrect:0, dialogueLangFilter:null, progressReportDays:7 };

const NAV = [
  {id:"home", icon:"🏠", key:"navHome"},
  {id:"lessons", icon:"📘", key:"navLessons"},
  {id:"dialogue", icon:"💬", key:"navDialogue"},
  {id:"vocab", icon:"🗂️", key:"navVocab"},
  {id:"progress", icon:"📈", key:"navProgress"},
  {id:"profile", icon:"⚙️", key:"navProfile"},
];

function renderSidebar(){
  // Пункт «Админ-панель» показывается только владельцу продукта — учётной
  // записи с e-mail ADMIN_EMAIL (п.5.13 ТЗ) — разделение Ученик / Администратор.
  const items = isAdminUser() ? NAV.concat([{id:"admin", icon:"🛠️", key:"navAdmin"}]) : NAV;
  document.getElementById("navlist").innerHTML = items.map(n=>
    `<button class="nav-item ${currentView===n.id?'active':''}" data-view="${n.id}"><span class="ico">${n.icon}</span>${t(n.key)}</button>`
  ).join("");
  document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{currentView=b.dataset.view; ui.lessonId=null; renderApp();});
  document.getElementById("side-xp").textContent = state.xp;
  document.getElementById("side-streak").textContent = state.streak.count;
}

function renderApp(){
  renderSidebar();
  const main = document.getElementById("main-content");
  if(currentView==="home") main.innerHTML = viewHome();
  else if(currentView==="lessons") main.innerHTML = ui.lessonId ? viewLessonDetail() : viewLessons();
  else if(currentView==="dialogue") main.innerHTML = viewDialogue();
  else if(currentView==="vocab") main.innerHTML = viewVocab();
  else if(currentView==="progress") main.innerHTML = viewProgress();
  else if(currentView==="profile") main.innerHTML = viewProfile();
  else if(currentView==="admin") main.innerHTML = isAdminUser() ? viewAdmin() : (currentView="home", viewHome());
  bindViewEvents();
  saveState();
}

/* ---------- HOME ---------- */
function viewHome(){
  // Основной трек на главной определяется выбором пользователя при
  // регистрации (кыргызский/английский/оба — п.5.1 ТЗ): если выбран
  // английский (в т.ч. вместе с кыргызским), карточка "продолжить
  // обучение" ведёт по нему; если выбран только кыргызский — по нему.
  const targetLangs = (state.profile.targetLangs && state.profile.targetLangs.length) ? state.profile.targetLangs : ["en"];
  const showEn = targetLangs.includes("en");
  const showKy = targetLangs.includes("ky");
  const primaryLang = showEn ? "en" : "ky";
  const primaryPool = primaryLang==="en" ? EN_LESSONS : KY_LESSONS;
  const next = primaryPool.find(l=>!isLessonHidden(l.id) && !(state.lessonsProgress[l.id]&&state.lessonsProgress[l.id].status==="done"));
  const doneCount = Object.values(state.lessonsProgress).filter(l=>l.status==="done").length;
  const enDone = EN_LESSONS.filter(l=>state.lessonsProgress[l.id]&&state.lessonsProgress[l.id].status==="done").length;
  const kyDone = KY_LESSONS.filter(l=>state.lessonsProgress[l.id]&&state.lessonsProgress[l.id].status==="done").length;
  const due = state.vocab.filter(v=>v.nextReview<=todayStr()).length;
  const levelDisplay = showEn ? state.level : kyLevelLabel(state.kyLevel);
  // Карточка "второго" языка построена по той же логике и с той же кнопкой
  // ("Начать урок →", btn-primary, ведёт сразу в конкретный урок), что и
  // карточка "ПРОДОЛЖИТЬ ОБУЧЕНИЕ" выше — оба языка получают одинаковое
  // приглашение приступить к занятиям, независимо от того, какой из них
  // выбран основным треком.
  const otherLang = primaryLang==="en" ? "ky" : "en";
  const otherPool = otherLang==="en" ? EN_LESSONS : KY_LESSONS;
  const otherDone = otherLang==="en" ? enDone : kyDone;
  const otherNext = otherPool.find(l=>!isLessonHidden(l.id) && !(state.lessonsProgress[l.id]&&state.lessonsProgress[l.id].status==="done"));
  const otherTitle = otherLang==="en" ? "Английский язык" : "Кыргызский язык — текстовый старт";
  const otherMeta = otherLang==="en" ? `CEFR ${state.level||"—"}` : `уровень: ${kyLevelLabel(state.kyLevel)} · пока без озвучки`;
  const otherEyebrow = otherLang==="en" ? (showEn?"АНГЛИЙСКИЙ":"НОВОЕ") : (showKy?"КЫРГЫЗСКИЙ":"НОВОЕ");
  const otherStartBtn = otherNext
    ? `<button class="btn btn-primary" data-action="open-lesson" data-id="${otherNext.id}">Начать урок →</button>`
    : `<span class="badge badge-done">✓ пройдено</span>`;
  const otherLangCard = `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">
        <div><div class="eyebrow">${otherEyebrow}</div><h3>${otherTitle}</h3><p style="color:var(--muted);font-size:13.5px;">${otherDone}/${otherPool.length} уроков · ${otherMeta}</p></div>
        ${otherStartBtn}
      </div>`;
  return `
    <div class="page-head" style="display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;">
      <div><div class="eyebrow">ГЛАВНАЯ</div><h1>Привет, ${state.profile.name || "друг"}! 👋</h1><p style="color:var(--muted)">Уровень ${levelDisplay} · цель — ${goalLabel(state.profile.goal)} · план: ${state.weeklyLessons||4} урок(ов)/нед.</p></div>
      <div style="flex:none;">${penguinSVG(72)}</div>
    </div>
    <div class="stat-row">
      <div class="stat-chip"><div class="num">${doneCount}/${LESSONS.length}</div><div class="lbl">уроков пройдено</div></div>
      <div class="stat-chip"><div class="num">${state.xp}</div><div class="lbl">очков опыта</div></div>
      <div class="stat-chip"><div class="num">${state.streak.count}</div><div class="lbl">${t('streakUnit')}</div></div>
      <div class="stat-chip"><div class="num">${state.vocab.length}</div><div class="lbl">слов в словаре</div></div>
    </div>
    ${next ? `
    <div class="card">
      <div class="eyebrow">ПРОДОЛЖИТЬ ОБУЧЕНИЕ</div>
      <h3>${next.title}</h3>
      <p style="color:var(--muted);font-size:13.5px;">Уровень ${next.level} · ${next.exercises.length} упражнений</p>
      <button class="btn btn-primary" data-action="open-lesson" data-id="${next.id}">Начать урок →</button>
    </div>` : `<div class="card"><b>Уроки ${primaryLang==="en"?"английского":"кыргызского"} пройдены 🎉</b><p style="color:var(--muted);font-size:13.5px;">Новые уроки появятся здесь позже.</p></div>`}
    ${otherLangCard}
    ${due>0 ? `<div class="card"><div class="eyebrow">СЛОВАРЬ</div><h3>${due} слов(а) ждут повторения</h3><button class="btn" data-action="goto" data-view="vocab">Повторить сейчас →</button></div>` : ""}
    <div class="card">
      <div class="eyebrow">ЗНАЧКИ</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        ${badgeChip("first_lesson","Первый урок")}${badgeChip("streak3","Серия 3 дня")}${badgeChip("streak7","Серия 7 дней")}${badgeChip("vocab20","20 слов")}${badgeChip("first_dialogue","Первый диалог с ИИ")}
      </div>
    </div>`;
}
function badgeChip(id,label){
  const on = state.badges.includes(id);
  return `<span class="badge ${on?'badge-done':'badge-progress'}">${on?'✓ ':''}${label}</span>`;
}

/* ---------- LESSONS LIST ---------- */
function isLessonHidden(id){ return state.contentOverrides.hiddenLessons.includes(id); }
function viewLessons(){
  const lang = ui.lessonLangFilter || "en";
  const full = lang==="en" ? EN_LESSONS : KY_LESSONS;
  // Ученику скрытые администратором уроки не показываются вовсе;
  // администратор видит их с пометкой (управляются в Админ-панели, вкладка «Контент»).
  const list = isAdminUser() ? full : full.filter(l=>!isLessonHidden(l.id));
  return `
    <div class="page-head"><div class="eyebrow">${t('navLessons').toUpperCase()}</div><h1>Уроки</h1></div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn btn-sm ${lang==='en'?'btn-primary':''}" data-action="set-lesson-lang" data-lang="en">Английский</button>
      <button class="btn btn-sm ${lang==='ky'?'btn-primary':''}" data-action="set-lesson-lang" data-lang="ky">Кыргызча (текст)</button>
    </div>
    ${lang==="ky" ? `<div class="card" style="background:var(--gold-soft);border-color:var(--gold);margin-bottom:14px;"><p style="margin:0;font-size:13px;color:var(--on-gold-soft);">Пока без озвучки: голосовые технологии для кыргызского ещё в разработке. Материал базовый и будет дополняться.</p></div>` : ""}
    ${lang==="ky" ? `<div class="card" style="margin-bottom:14px;">
      <div class="eyebrow">ВАШ УРОВЕНЬ КЫРГЫЗСКОГО</div>
      <div class="choice-row" style="margin-top:8px;">
        ${KY_LEVELS.map(lv=>`<button class="choice-pill ${state.kyLevel===lv.id?'selected':''}" data-action="set-ky-level" data-level="${lv.id}">${lv.label}</button>`).join("")}
      </div>
    </div>` : ""}
    <div class="card" style="padding:8px;">
      ${list.map(l=>{
        const prog = state.lessonsProgress[l.id];
        const status = prog ? prog.status : "not_started";
        const badge = status==="done" ? `<span class="badge badge-done">✓ пройдено · ${prog.bestScore}%</span>` : status==="in_progress" ? `<span class="badge badge-progress">в процессе</span>` : `<span class="badge badge-level">${l.level}</span>`;
        const hiddenTag = isLessonHidden(l.id) ? ` <span class="badge" style="background:var(--coral-soft);color:var(--on-coral-soft);">скрыт админом</span>` : "";
        return `<div class="lesson-card" style="border-bottom:1px solid var(--border);">
          <div><h3>${l.title}${hiddenTag}</h3><p>${l.exercises.length} упражнений</p></div>
          <div style="display:flex;align-items:center;gap:10px;">${badge}<button class="btn btn-sm" data-action="open-lesson" data-id="${l.id}">${status==="done"?"Повторить":"Открыть"}</button></div>
        </div>`;
      }).join("")}
    </div>`;
}

/* ---------- LESSON DETAIL / EXERCISE ENGINE ---------- */
function viewLessonDetail(){
  const lesson = LESSONS.find(l=>l.id===ui.lessonId);
  if(!lesson) return viewLessons();
  const hasMiniTest = lesson.miniTest && lesson.miniTest.length;
  if(ui.exIdx >= lesson.exercises.length){
    if(hasMiniTest && (ui.miniTestIdx||0) < lesson.miniTest.length) return viewMiniTest(lesson);
    return viewLessonSummary(lesson);
  }
  const ex = lesson.exercises[ui.exIdx];
  const es = ui.exState;
  const progressPct = Math.round((ui.exIdx/lesson.exercises.length)*100);

  let bodyHtml = "";
  if(ui.exIdx===0 && !es.introShown){
    const audioBtn = x => lesson.lang!=="ky" ? ` <button class="btn btn-sm btn-ghost" data-action="speak" data-text="${escAttr(x)}">🔊</button>` : "";
    bodyHtml += `<div class="card"><div class="eyebrow">ОБЪЯСНЕНИЕ</div><p>${lesson.explain}</p>
      <div class="eyebrow" style="margin-top:10px;">ПРИМЕРЫ</div>
      <ul style="margin:6px 0 0;padding-left:18px;">${lesson.examples.map(x=>`<li>${x}${audioBtn(x)}</li>`).join("")}</ul>
    </div>`;
  }

  bodyHtml += `<div class="card exercise-box">
    <div class="eyebrow">УПРАЖНЕНИЕ ${ui.exIdx+1} ИЗ ${lesson.exercises.length}</div>
    ${renderExercise(ex, es)}
    <div id="ex-feedback"></div>
  </div>`;

  return `
    <div class="page-head">
      <button class="btn btn-ghost btn-sm" data-action="goto" data-view="lessons">← К списку уроков</button>
      <h1 style="margin-top:10px;">${lesson.title}</h1>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    </div>
    ${bodyHtml}`;
}

/* Мини-тест в конце урока для закрепления (п.5.4 ТЗ) — короткая проверка
   (2-3 вопроса) после основных упражнений, отдельная от них по счёту и по
   смыслу: упражнения учат по ходу урока, мини-тест проверяет, что материал
   закрепился, и не даёт подсказок/AI-кнопок, как обычные упражнения. */
function viewMiniTest(lesson){
  const i = ui.miniTestIdx||0;
  const q = lesson.miniTest[i];
  const progressPct = Math.round(((lesson.exercises.length+i)/(lesson.exercises.length+lesson.miniTest.length))*100);
  return `
    <div class="page-head">
      <button class="btn btn-ghost btn-sm" data-action="goto" data-view="lessons">← К списку уроков</button>
      <h1 style="margin-top:10px;">${lesson.title}</h1>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    </div>
    <div class="card exercise-box">
      <div class="eyebrow">МИНИ-ТЕСТ ДЛЯ ЗАКРЕПЛЕНИЯ · ВОПРОС ${i+1} ИЗ ${lesson.miniTest.length}</div>
      <p style="font-size:16px;font-weight:600;">${q.q}</p>
      <div class="opt-list">${q.opts.map((o,oi)=>`<button class="opt-btn" data-action="minitest-pick" data-i="${oi}">${o}</button>`).join("")}</div>
      <div id="ex-feedback"></div>
    </div>`;
}

function renderExercise(ex, es){
  if(ex.type==="mcq"){
    return `<p style="font-size:16px;font-weight:600;">${ex.q}</p>
      <div class="opt-list">${ex.opts.map((o,i)=>`<button class="opt-btn" data-action="mcq-pick" data-i="${i}">${o}</button>`).join("")}</div>`;
  }
  if(ex.type==="fill"){
    const parts = ex.sentence.split("___");
    return `<p class="fill-line">${parts[0]}<input class="fill-input" id="fill-input" placeholder="...">${parts[1]||""}</p>
      <button class="btn btn-primary btn-sm" data-action="check-fill" style="margin-top:10px;">Проверить</button>`;
  }
  if(ex.type==="translate"){
    return `<p style="font-weight:600;">${ex.prompt}</p>
      <input type="text" id="tr-input" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card-solid);color:var(--ink);" placeholder="Введите перевод на английском">
      <button class="btn btn-primary btn-sm" data-action="check-translate" style="margin-top:10px;">Проверить</button>`;
  }
  if(ex.type==="match"){
    if(!es.matchLeftSel) es.matchLeftSel=null;
    if(!es.pairs) es.pairs={};
    const left = ex.pairs.map(p=>p[0]);
    const rightShuffled = es.rightOrder || (es.rightOrder = shuffle(ex.pairs.map(p=>p[1])));
    return `<p style="font-weight:600;">Сопоставьте пары (перетащите слева направо — или нажмите слева, затем справа)</p>
      <div class="match-cols">
        <div class="match-col">${left.map((l,i)=>`<div class="match-item ${es.pairs[i]!==undefined?'paired':(es.matchLeftSel===i?'sel':'')}" data-action="match-left" data-i="${i}" draggable="true">${l}</div>`).join("")}</div>
        <div class="match-col">${rightShuffled.map((r,ri)=>`<div class="match-item ${Object.values(es.pairs).includes(ri)?'paired':''}" data-action="match-right" data-ri="${ri}">${r}</div>`).join("")}</div>
      </div>
      <button class="btn btn-primary btn-sm" data-action="check-match" style="margin-top:12px;">Проверить</button>`;
  }
  if(ex.type==="pronounce"){
    const hasSR = ("SpeechRecognition" in window || "webkitSpeechRecognition" in window);
    return `<p style="font-size:14px;color:var(--muted);">Проверка произношения</p>
      <p style="font-size:20px;font-weight:700;margin:6px 0 14px;">«${ex.phrase}»</p>
      ${hasSR ? `<button class="btn btn-primary btn-sm" data-action="pronounce-record">🎙️ Записать голосом</button>` : `<p style="font-size:12.5px;color:var(--muted);">Микрофон-распознавание не поддерживается в этом браузере — введите фразу текстом ниже.</p>`}
      <div style="margin-top:10px;display:flex;gap:8px;">
        <input type="text" id="pronounce-input" placeholder="${hasSR?'или впишите то, что сказали, текстом':'введите фразу текстом'}" style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card-solid);color:var(--ink);">
        <button class="btn btn-primary btn-sm" data-action="pronounce-check">Проверить</button>
      </div>`;
  }
  if(ex.type==="listen"){
    return `<p style="font-size:14px;color:var(--muted);">Аудирование — прослушайте фразу и ответьте на вопрос</p>
      <button class="btn btn-primary btn-sm" data-action="speak" data-text="${escAttr(ex.audioText)}" style="margin:4px 0 16px;">🔊 Прослушать фразу</button>
      <p style="font-weight:600;">${ex.question}</p>
      <div class="opt-list">${ex.opts.map((o,i)=>`<button class="opt-btn" data-action="mcq-pick" data-i="${i}">${o}</button>`).join("")}</div>`;
  }
  if(ex.type==="reading"){
    return `<p style="font-size:14px;color:var(--muted);">Чтение — прочитайте текст и ответьте на вопрос</p>
      <div class="card" style="margin:6px 0 14px;background:var(--card-solid);"><p style="margin:0;font-size:14px;line-height:1.6;">${ex.passage}</p></div>
      <p style="font-weight:600;">${ex.q}</p>
      <div class="opt-list">${ex.opts.map((o,i)=>`<button class="opt-btn" data-action="mcq-pick" data-i="${i}">${o}</button>`).join("")}</div>`;
  }
  return "";
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function escAttr(s){ return String(s).replace(/"/g,"&quot;"); }
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ============================================================
   МОДЕРАЦИЯ ДИАЛОГОВ С ИИ (п.5.13 ТЗ) — простая клиентская
   эвристика по ключевым словам/паттернам. Ничего не блокирует
   в диалоге ученика (чат остаётся живым), а лишь тихо ставит
   сообщение в очередь на просмотр администратором/методистом.
============================================================ */
const MODERATION_RULES = [
  {category:"грубость", rx:/\b(идиот|тупой|дурак|stupid|idiot|dumb)\b/i},
  {category:"личные данные", rx:/\b(пароль|password|номер карты|credit card|cvv)\b/i},
  {category:"вне темы обучения", rx:/\b(наркотик|оружие|drugs|weapon)\b/i},
];
function newMsgId(){ return "d"+Date.now()+Math.random().toString(36).slice(2,7); }
function moderateText(text, msgId){
  for(const rule of MODERATION_RULES){
    if(rule.rx.test(text)){
      state.moderationLog.push({
        id:"m"+Date.now()+Math.random().toString(36).slice(2,7),
        ts:new Date().toISOString(), msgId, text, category:rule.category, status:"pending"
      });
      break; // одной записи на сообщение достаточно для демо
    }
  }
}
function norm(s){ return s.toLowerCase().trim().replace(/[.!?']/g,""); }
// Разбор произнесённой фразы по словам эталона (п.5.6 ТЗ): для каждого
// слова эталонной фразы отмечает, было ли оно найдено в распознанном
// тексте — это даёт материал для визуальной обратной связи "что именно
// произнесено неверно", а не только общий процент совпадения.
function wordMatchDetail(target, said){
  const words = s => s.toLowerCase().replace(/[^\w\s]/g,"").split(/\s+/).filter(Boolean);
  const t = words(target), sArr = words(said);
  const pool = sArr.slice();
  return t.map(w=>{
    const idx = pool.indexOf(w);
    const ok = idx>-1;
    if(ok) pool.splice(idx,1);
    return {word:w, ok};
  });
}
function wordMatchScore(target, said){
  const detail = wordMatchDetail(target, said);
  if(!detail.length) return 0;
  return detail.filter(d=>d.ok).length / detail.length;
}
// Цветные "чипы" по словам эталонной фразы: зелёный — слово распознано в
// сказанном, красный — не распознано (эталонные слова безопасны для
// innerHTML — это фиксированный контент урока, а не ввод пользователя).
function pronounceFeedbackHtml(target, said){
  const detail = wordMatchDetail(target, said);
  return `<div class="pron-detail">${detail.map(d=>`<span class="pron-chip ${d.ok?'pron-ok':'pron-bad'}">${escHtml(d.word)}</span>`).join(" ")}</div>`;
}
// Общая логика сопоставления пары (правая колонка): вызывается как кликом
// по правому элементу, так и перетаскиванием (drag-and-drop, п.5.7 ТЗ) —
// оба способа ведут к одному и тому же состоянию.
function pairMatchRight(ri){
  if(ui.exState.matchLeftSel!=null){
    ui.exState.pairs[ui.exState.matchLeftSel] = ri;
    ui.exState.matchLeftSel = null;
  }
  renderApp();
}

function viewLessonSummary(lesson){
  const total = lesson.exercises.length;
  const correct = ui.correctCount || 0;
  const pct = Math.round((correct/total)*100);
  // Текстовый диалог с ИИ доступен на обоих языках (п.5.5 ТЗ) — только голос
  // ограничен английским (речевые технологии для кыргызского требуют
  // отдельного R&D, см. раздел 8 ТЗ), поэтому кнопка есть у уроков любого
  // языка, но передаёт язык урока, чтобы диалог открылся на нужном языке.
  const dialogueBtn = `<button class="btn btn-primary" data-action="dialogue-from-lesson" data-topic="${escAttr(lesson.title)}" data-lang="${lesson.lang}">Практика диалога по теме →</button>`;
  const hasMiniTest = lesson.miniTest && lesson.miniTest.length;
  const miniTestLine = hasMiniTest
    ? `<p style="color:var(--muted);margin-top:2px;">Мини-тест на закрепление: ${ui.miniTestCorrect||0} из ${lesson.miniTest.length} верно</p>`
    : "";
  return `
    <div class="page-head"><h1>Урок завершён 🎉</h1></div>
    <div class="card" style="text-align:center;">
      <div class="result-badge" style="background:var(--teal-soft);color:var(--teal);">${pct}%</div>
      <h2>${correct} из ${total} правильно</h2>
      ${miniTestLine}
      <p style="color:var(--muted);">+${ui.xpEarned||0} XP получено за этот урок</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px;">
        <button class="btn btn-ghost btn-sm" data-action="goto" data-view="lessons">← К списку уроков</button>
        ${dialogueBtn}
      </div>
    </div>`;
}

/* Итог урока (прогресс/лучший результат/XP/бейджи) фиксируется один раз —
   после основных упражнений, если у урока нет мини-теста, либо после
   мини-теста на закрепление (п.5.4 ТЗ), если он есть. */
function finalizeLessonCompletion(lesson){
  const total = lesson.exercises.length;
  const pct = Math.round(((ui.correctCount||0)/total)*100);
  const prev = state.lessonsProgress[lesson.id] || {attempts:0, bestScore:0};
  state.lessonsProgress[lesson.id] = {
    status:"done",
    bestScore: Math.max(prev.bestScore||0, pct),
    attempts: (prev.attempts||0) + 1,
    lastCompletedAt: todayStr() // для еженедельного/месячного отчёта (п.5.9 ТЗ)
  };
  ui.xpEarned = (ui.xpEarned||0) + 30;
  addXP(30);
  checkBadges(); saveState();
}

/* ---------- exercise interaction handlers ---------- */
function finalizeExercise(lesson, correct, explainText, exObj){
  ui.correctCount = (ui.correctCount||0) + (correct?1:0);
  const gained = correct?10:2;
  ui.xpEarned = (ui.xpEarned||0) + gained;
  const fb = document.getElementById("ex-feedback");
  addXP(gained);
  recordSkillAttempt(exObj&&exObj.type, correct);
  if(!correct){
    state.errorsLog.push({lessonId:lesson.id, exType:(exObj&&exObj.type)||"unknown", date:todayStr()});
  }
  fb.innerHTML = `<div class="feedback-box ${correct?'feedback-ok':'feedback-bad'}">
      <b>${correct?"Верно!":"Не совсем."}</b> ${explainText||""}
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm" data-action="ai-explain" data-ex-explain="${escAttr(explainText||"")}">✨ Объяснить иначе (ИИ)</button>
        <button class="btn btn-sm" data-action="ai-example" data-topic="${escAttr(lesson.title)}">✨ Ещё пример (ИИ)</button>
        <button class="btn btn-sm btn-primary" data-action="next-exercise" style="margin-left:auto;">Далее →</button>
      </div>
      <div class="ai-inline hidden" id="ai-extra"></div>
    </div>`;
}

// Единый делегированный обработчик кликов — вешается ОДИН раз на document.
// Это важно: часть кнопок (например "Далее", "Объяснить иначе") добавляется в DOM
// напрямую через innerHTML уже ПОСЛЕ полного рендера (см. finalizeExercise), поэтому
// точечная привязка onclick к каждому найденному элементу их бы не поймала.
async function handleDataAction(elm){
      const a = elm.dataset.action;
      if(a==="goto"){ currentView = elm.dataset.view; ui.lessonId=null; renderApp(); return; }
      if(a==="logout"){ if(confirm("Выйти из аккаунта?")) logout(); return; }
      if(a==="goto-lessons-lang"){ currentView="lessons"; ui.lessonId=null; ui.lessonLangFilter = elm.dataset.lang||"en"; renderApp(); return; }
      if(a==="set-lesson-lang"){ ui.lessonLangFilter = elm.dataset.lang||"en"; renderApp(); return; }
      if(a==="set-ky-level"){ state.kyLevel = elm.dataset.level; saveState(); toast("Уровень кыргызского сохранён: " + kyLevelLabel(state.kyLevel)); renderApp(); return; }
      if(a==="open-lesson"){
        if(!isAdminUser() && isLessonHidden(elm.dataset.id)){ toast("Урок временно недоступен"); return; }
        // currentView должен переключаться на "lessons" явно: эта кнопка также
        // встречается на Главной и в Прогрессе (история ошибок → "Повторить
        // урок"), где currentView ещё не "lessons" — без этой строки урок
        // молча не открывался бы с тех экранов.
        currentView = "lessons";
        ui.lessonId = elm.dataset.id; ui.exIdx=0; ui.exState={}; ui.correctCount=0; ui.xpEarned=0; ui.miniTestIdx=0; ui.miniTestCorrect=0;
        const openedLesson = LESSONS.find(l=>l.id===ui.lessonId);
        if(openedLesson) ui.lessonLangFilter = openedLesson.lang;
        if(!state.lessonsProgress[ui.lessonId]) state.lessonsProgress[ui.lessonId] = {status:"in_progress", attempts:0, bestScore:0};
        else if(state.lessonsProgress[ui.lessonId].status!=="done") state.lessonsProgress[ui.lessonId].status="in_progress";
        saveState(); renderApp(); return;
      }
      if(a==="admin-tab"){ ui.adminTab = elm.dataset.tab; renderApp(); return; }
      if(a==="admin-toggle-lesson"){
        if(!isAdminUser()) return;
        const id = elm.dataset.id;
        const idx = state.contentOverrides.hiddenLessons.indexOf(id);
        if(idx>=0) state.contentOverrides.hiddenLessons.splice(idx,1);
        else state.contentOverrides.hiddenLessons.push(id);
        saveState(); renderApp(); return;
      }
      if(a==="admin-resolve-flag"){
        if(!isAdminUser()) return;
        const entry = state.moderationLog.find(f=>f.id===elm.dataset.id);
        if(entry) entry.status = "reviewed";
        saveState(); renderApp(); return;
      }
      if(a==="admin-remove-msg"){
        if(!isAdminUser()) return;
        const entry = state.moderationLog.find(f=>f.id===elm.dataset.id);
        if(entry){
          // Ищем сообщение по стабильному id, а не по индексу массива: индексы
          // сдвигаются при обрезке истории диалога до последних 16 сообщений
          // (см. sendChatMessage), а id остаётся верным всегда.
          // entry.msgId может отсутствовать у флагов, сохранённых более старой
          // версией схемы (до перехода на стабильные id) — тогда не пытаемся
          // искать по id вовсе, иначе undefined===undefined совпал бы с первым
          // же сообщением без id и стёр бы не то сообщение.
          const msg = entry.msgId ? state.dialogue.find(m=>m.id===entry.msgId) : null;
          if(msg && msg.content===entry.text){
            msg.content = "[сообщение удалено модератором]";
            entry.status = "removed";
          }else{
            entry.status = "removed"; // сообщение уже выпало из окна истории — просто закрываем флаг
            toast("Сообщение уже не хранится в истории диалога (окно 16 сообщений) — флаг закрыт");
            saveState(); renderApp(); return;
          }
        }
        saveState(); renderApp(); toast("Сообщение удалено из истории диалога"); return;
      }
      if(a==="speak"){ speak(elm.dataset.text); return; }
      if(a==="speak-dialogue-msg"){
        const idx = parseInt(elm.dataset.idx,10);
        const msg = state.dialogue[idx];
        if(msg) speak(msg.content);
        return;
      }
      // Должно обрабатываться ДО проверки "const lesson = ...; if(!lesson)
      // return;" ниже: к моменту переключения языка диалога ui.lessonId уже
      // очищен (диалог открыт не из карточки урока), и без этой строки
      // переключатель "Английский/Кыргызча" в Диалоге молча не срабатывал бы.
      if(a==="set-dialogue-lang"){ ui.dialogueLangFilter = elm.dataset.lang==="ky" ? "ky" : "en"; renderApp(); return; }
      if(a==="set-report-range"){ ui.progressReportDays = parseInt(elm.dataset.days,10)===30 ? 30 : 7; renderApp(); return; }

      const lesson = LESSONS.find(l=>l.id===ui.lessonId);
      if(!lesson) return;
      const ex = lesson.exercises[ui.exIdx];

      if(a==="mcq-pick"){
        const i = parseInt(elm.dataset.i,10);
        document.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
        elm.classList.add(i===ex.a?"correct":"wrong");
        if(i!==ex.a) document.querySelectorAll(".opt-btn")[ex.a].classList.add("correct");
        finalizeExercise(lesson, i===ex.a, ex.explain, ex);
      }
      if(a==="check-fill"){
        const val = norm(document.getElementById("fill-input").value);
        const ok = ex.answers.map(norm).includes(val);
        finalizeExercise(lesson, ok, ex.explain + (ok?"":` Правильный ответ: «${ex.answers[0]}».`), ex);
      }
      if(a==="check-translate"){
        const val = norm(document.getElementById("tr-input").value);
        const ok = ex.answers.map(norm).includes(val);
        finalizeExercise(lesson, ok, ex.explain + (ok?"":` Пример: «${ex.answers[0]}».`), ex);
      }
      if(a==="match-left"){ ui.exState.matchLeftSel = parseInt(elm.dataset.i,10); renderApp(); return; }
      if(a==="match-right"){ pairMatchRight(parseInt(elm.dataset.ri,10)); return; }
      if(a==="check-match"){
        const rightOrder = ui.exState.rightOrder;
        let allCorrect = true;
        ex.pairs.forEach((p,i)=>{
          const chosenRi = ui.exState.pairs[i];
          if(chosenRi===undefined || rightOrder[chosenRi]!==p[1]) allCorrect=false;
        });
        finalizeExercise(lesson, allCorrect, allCorrect?"Все пары верны.":"Некоторые пары неверны — сверьтесь с объяснением урока.", ex);
      }
      if(a==="pronounce-record"){
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ toast("Распознавание речи недоступно в этом браузере"); return; }
        const inputEl = document.getElementById("pronounce-input");
        elm.disabled = true; elm.textContent = "🔴 Слушаю…";
        const rec = new SR();
        rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
        rec.onresult = (e)=>{ if(inputEl) inputEl.value = e.results[0][0].transcript; };
        rec.onerror = ()=>{ toast("Не удалось распознать речь — попробуйте ещё раз или введите текстом"); };
        rec.onend = ()=>{ elm.disabled = false; elm.textContent = "🎙️ Записать голосом"; };
        try{ rec.start(); }catch(err){ elm.disabled=false; elm.textContent="🎙️ Записать голосом"; }
      }
      if(a==="pronounce-check"){
        const said = (document.getElementById("pronounce-input")||{}).value || "";
        if(!said.trim()){ toast("Сначала произнесите или введите фразу"); return; }
        const score = wordMatchScore(ex.phrase, said);
        const pct = Math.round(score*100);
        const ok = score >= 0.6;
        const visualFb = pronounceFeedbackHtml(ex.phrase, said);
        finalizeExercise(lesson, ok, `Совпадение слов: ${pct}%. ${visualFb}${ex.explain||""} ${ok?"":"Слова, отмеченные красным, не удалось распознать — попробуйте произнести фразу ещё раз, чётко проговаривая их."}`, ex);
      }
      if(a==="next-exercise"){
        ui.exState = {}; ui.exIdx += 1;
        if(ui.exIdx >= lesson.exercises.length && !(lesson.miniTest && lesson.miniTest.length)){
          finalizeLessonCompletion(lesson);
        }
        renderApp();
      }
      if(a==="minitest-pick"){
        const mq = lesson.miniTest[ui.miniTestIdx||0];
        const i = parseInt(elm.dataset.i,10);
        document.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
        const correct = i===mq.a;
        elm.classList.add(correct?"correct":"wrong");
        if(!correct) document.querySelectorAll(".opt-btn")[mq.a].classList.add("correct");
        if(correct) ui.miniTestCorrect = (ui.miniTestCorrect||0) + 1;
        ui.xpEarned = (ui.xpEarned||0) + (correct?5:1);
        addXP(correct?5:1);
        const fb = document.getElementById("ex-feedback");
        fb.innerHTML = `<div class="feedback-box ${correct?'feedback-ok':'feedback-bad'}">
            <b>${correct?"Верно!":"Не совсем."}</b> ${mq.explain||""}
            <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-sm btn-primary" data-action="minitest-next" style="margin-left:auto;">Далее →</button>
            </div>
          </div>`;
      }
      if(a==="minitest-next"){
        ui.miniTestIdx = (ui.miniTestIdx||0) + 1;
        if(ui.miniTestIdx >= lesson.miniTest.length){
          finalizeLessonCompletion(lesson);
        }
        renderApp();
      }
      if(a==="dialogue-from-lesson"){
        currentView="dialogue"; ui.lessonId=null; dialoguePrefillTopic = elm.dataset.topic;
        ui.dialogueLangFilter = elm.dataset.lang==="ky" ? "ky" : "en";
        renderApp();
      }
      if(a==="ai-explain"){
        const box = document.getElementById("ai-extra");
        box.classList.remove("hidden"); box.textContent = "ИИ печатает объяснение…";
        // Формулировка подстраивается под язык ТЕКУЩЕГО урока (английский/
        // кыргызский), а не зашита под английский — иначе подсказка в
        // кыргызском уроке была бы некорректной (п.5.4/5.8 ТЗ).
        const exLesson = LESSONS.find(l=>l.id===ui.lessonId);
        const exLangName = exLesson && exLesson.lang==="ky" ? "кыргызского" : "английского";
        try{
          const prompt = `Ты — дружелюбный преподаватель ${exLangName} языка. Объясни другими словами, максимально просто и коротко (2-3 предложения, на русском языке), следующую заметку для ученика${exLangName==="английского"?` уровня ${state.level||"A1"}`:""}: "${elm.dataset.exExplain}"`;
          const text = await geminiGenerate(null, [{role:"user", content: prompt}]);
          box.textContent = "✨ " + text;
        }catch(e){ box.textContent = "Не удалось получить объяснение от ИИ. " + aiErrorMessage(e); }
      }
      if(a==="ai-example"){
        const box = document.getElementById("ai-extra");
        box.classList.remove("hidden"); box.textContent = "ИИ подбирает пример…";
        const exLesson2 = LESSONS.find(l=>l.id===ui.lessonId);
        const exLangName2 = exLesson2 && exLesson2.lang==="ky" ? "кыргызском" : "английском";
        try{
          const prompt = `Придумай ОДИН новый простой пример предложения на ${exLangName2} языке (с переводом на русский в скобках) на тему урока "${elm.dataset.topic}"${exLangName2==="английском"?`, подходящий для уровня ${state.level||"A1"}`:""}. Ответь только предложением, без пояснений.`;
          const text = await geminiGenerate(null, [{role:"user", content: prompt}]);
          box.textContent = "✨ " + text;
        }catch(e){ box.textContent = "Не удалось получить пример от ИИ. " + aiErrorMessage(e); }
      }
}

let _delegatedClickBound = false;
function bindViewEvents(){
  if(!_delegatedClickBound){
    document.addEventListener("click", function(event){
      const elm = event.target.closest("[data-action]");
      if(!elm) return;
      handleDataAction(elm);
    });
    // Drag-and-drop для упражнения "сопоставление" (п.5.7 ТЗ) — делегированные
    // обработчики один раз на document, т.к. элементы перерисовываются целиком
    // через innerHTML при каждом renderApp() (аналогично клику выше).
    document.addEventListener("dragstart", function(event){
      const elm = event.target.closest('[data-action="match-left"]');
      if(!elm) return;
      ui.exState.matchLeftSel = parseInt(elm.dataset.i,10);
      try{ event.dataTransfer.setData("text/plain", elm.dataset.i); event.dataTransfer.effectAllowed = "move"; }catch(e){}
    });
    document.addEventListener("dragover", function(event){
      const elm = event.target.closest('[data-action="match-right"]');
      if(!elm) return;
      event.preventDefault();
      elm.classList.add("drag-over");
    });
    document.addEventListener("dragleave", function(event){
      const elm = event.target.closest('[data-action="match-right"]');
      if(elm) elm.classList.remove("drag-over");
    });
    document.addEventListener("drop", function(event){
      const elm = event.target.closest('[data-action="match-right"]');
      if(!elm) return;
      event.preventDefault();
      pairMatchRight(parseInt(elm.dataset.ri,10));
    });
    _delegatedClickBound = true;
  }
  // vocab / dialogue / profile bindings (elements are always freshly rendered
  // by renderApp() right before this runs, so direct binding here is safe)
  bindVocabEvents();
  bindDialogueEvents();
  bindProfileEvents();
  bindAdminEvents();
}

function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ /* TTS недоступен в этом браузере */ }
}

/* ============================================================
   ДИАЛОГ С ИИ (п.5.5 ТЗ) — текстовый чат доступен на английском И на
   кыргызском (у каждого языка своя история диалога, state.dialogue /
   state.dialogueKy). Голосовой режим (STT/TTS) — только для английского:
   речевые технологии для кыргызского требуют отдельного R&D (раздел 8 ТЗ),
   поэтому в кыргызском режиме микрофон и озвучивание скрыты.
============================================================ */
let dialoguePrefillTopic = null;
// Язык диалога выбирается пользователем свободно (переключатель ниже) и не
// ограничен языками, выбранными при регистрации (п.5.1 ТЗ) — точно так же,
// как вкладки "Английский/Кыргызча" в Уроках доступны независимо от выбора
// при регистрации. targetLangs используется только чтобы предложить разумное
// значение по умолчанию при первом заходе.
function dialogueLang(){
  let lang = ui.dialogueLangFilter;
  if(!lang){
    const targetLangs = (state.profile.targetLangs && state.profile.targetLangs.length) ? state.profile.targetLangs : ["en"];
    lang = targetLangs.includes("en") ? "en" : "ky";
  }
  ui.dialogueLangFilter = lang;
  return lang;
}
const DIALOGUE_TOPICS = {
  en: ["Travel", "Daily routine", "Food", "Work", "Weekend plans"],
  ky: ["Саякат", "Күнүмдүк жашоо", "Тамак-аш", "Жумуш", "Дем алыш күндөрү"]
};
function viewDialogue(){
  const lang = dialogueLang();
  const log = lang==="ky" ? state.dialogueKy : state.dialogue;
  if(log.length===0){
    const greet = lang==="ky"
      ? `Салам, ${state.profile.name||"дос"}! Мен Mr. Penguin, сенин кыргыз тили мугалимиңмин 🐧. Каалаган темада же эркин сүйлөшө беребиз. Баштайлыбы?`
      : `Hi ${state.profile.name||"there"}! I'm Mr. Penguin, your English tutor 🐧. We can chat about anything — or pick a topic below. Ready?`;
    log.push({role:"assistant", content:greet, id:newMsgId()});
  }
  const topics = DIALOGUE_TOPICS[lang];
  // Переключатель языка всегда доступен, как и вкладки "Английский/Кыргызча"
  // в Уроках — не завязан на языки, выбранные при регистрации.
  const langToggle = `
    <div style="display:flex;gap:8px;margin-bottom:4px;">
      <button class="btn btn-sm ${lang==='en'?'btn-primary':''}" data-action="set-dialogue-lang" data-lang="en">Английский</button>
      <button class="btn btn-sm ${lang==='ky'?'btn-primary':''}" data-action="set-dialogue-lang" data-lang="ky">Кыргызча (текст)</button>
    </div>`;
  const kyVoiceNote = lang==="ky"
    ? `<div class="card" style="background:var(--gold-soft);border-color:var(--gold);margin-bottom:14px;"><p style="margin:0;font-size:13px;color:var(--on-gold-soft);">Пока без голоса: диалог на кыргызском — только текстом. Голосовые технологии (распознавание/озвучивание речи) для кыргызского ещё в разработке.</p></div>`
    : "";
  const inputPlaceholder = lang==="ky" ? "Билдирүү жазыңыз (кыргызча)…" : "Write a message in English…";
  const prefillText = dialoguePrefillTopic
    ? (lang==="ky" ? `Келгиле, «${dialoguePrefillTopic}» темасы боюнча сүйлөшөлү.` : `Let's talk about ${dialoguePrefillTopic}.`)
    : "";
  const micBtnHtml = lang==="en" ? `<button class="btn btn-sm" id="mic-btn" title="Голосовой ввод (английский)" style="flex:none;">🎙️</button>` : "";
  return `
    <div class="page-head" style="display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;">
      <div><div class="eyebrow">${t('navDialogue').toUpperCase()}</div><h1>Живое общение с Mr. Penguin</h1><p style="color:var(--muted)">ИИ мягко исправляет ошибки и объясняет их.</p></div>
      <div style="flex:none;">${penguinSVG(56)}</div>
    </div>
    ${langToggle}
    ${kyVoiceNote}
    <div class="chat-wrap">
      <div class="chat-log" id="chat-log">
        ${log.map((m,i)=>`<div class="msg ${m.role==='user'?'msg-user':'msg-ai'}"><div class="msg-meta">${m.role==='user'?'ВЫ':'🐧 MR. PENGUIN'}</div>${escHtml(m.content)}${(m.role==='assistant'&&lang==='en')?` <button class="btn btn-sm btn-ghost" data-action="speak-dialogue-msg" data-idx="${i}" style="padding:2px 8px;margin-left:2px;vertical-align:middle;">🔊</button>`:''}</div>`).join("")}
      </div>
      <div style="padding:0 14px;display:flex;gap:6px;flex-wrap:wrap;">
        ${topics.map(tp=>`<button class="btn btn-sm" data-action="chat-topic" data-topic="${tp}">${tp}</button>`).join("")}
      </div>
      <div class="chat-input-row">
        ${micBtnHtml}
        <input type="text" id="chat-input" placeholder="${inputPlaceholder}" value="${escAttr(prefillText)}">
        <button class="btn btn-primary" data-action="chat-send">Отправить</button>
      </div>
    </div>`;
}
function bindDialogueEvents(){
  const send = document.querySelector('[data-action="chat-send"]');
  if(!send) return;
  const lang = dialogueLang();
  const input = document.getElementById("chat-input");
  const doSend = ()=>sendChatMessage(input.value, lang);
  send.onclick = doSend;
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") doSend(); });
  const micBtn = document.getElementById("mic-btn");
  if(micBtn){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      micBtn.disabled = true; micBtn.title = "Голосовой ввод не поддерживается в этом браузере";
    }else{
      micBtn.onclick = ()=>{
        const rec = new SR();
        rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
        micBtn.disabled = true; micBtn.textContent = "🔴";
        rec.onresult = (e)=>{ if(input) input.value = e.results[0][0].transcript; };
        rec.onerror = ()=>{ toast("Не удалось распознать речь"); };
        rec.onend = ()=>{ micBtn.disabled = false; micBtn.textContent = "🎙️"; };
        try{ rec.start(); }catch(err){ micBtn.disabled=false; micBtn.textContent="🎙️"; }
      };
    }
  }
  document.querySelectorAll('[data-action="chat-topic"]').forEach(b=>{
    b.onclick = ()=>{
      input.value = lang==="ky" ? `«${b.dataset.topic}» темасы боюнча сүйлөшөлү.` : `Let's talk about ${b.dataset.topic.toLowerCase()}.`;
      input.focus();
    };
  });
}
async function sendChatMessage(text, lang){
  text = (text||"").trim();
  if(!text) return;
  lang = lang==="ky" ? "ky" : "en";
  const log = lang==="ky" ? state.dialogueKy : state.dialogue;
  dialoguePrefillTopic = null;
  const userMsgId = newMsgId();
  log.push({role:"user", content:text, id:userMsgId});
  moderateText(text, userMsgId);
  if(log.length>16) log.splice(0, log.length-16);
  markActivity(); checkBadges(); saveState();
  renderApp();
  const chatLog = document.getElementById("chat-log");
  const thinkingEl = document.createElement("div");
  thinkingEl.className = "msg msg-ai"; thinkingEl.innerHTML = `<div class="msg-meta">🐧 MR. PENGUIN</div><span class="typing"><span></span><span></span><span></span></span>`;
  chatLog.appendChild(thinkingEl); chatLog.scrollTop = chatLog.scrollHeight;

  try{
    const instructions = lang==="ky"
      ? `Ты — дружелюбный, терпеливый преподаватель кыргызского языка, пингвин по имени Mr. Penguin. Уровень ученика по кыргызскому: «${kyLevelLabel(state.kyLevel)}». Правила:
- Отвечай в основном на кыргызском, адаптируя сложность речи под уровень ученика (для «не знаю»/«начальный» — короткие простые фразы и добавляй перевод/пояснение на русском в скобках; для «бытовой»/«свободный» — почти всё на кыргызском).
- Если ученик допускает ошибку (грамматика, лексика), мягко поправь: сначала кратко похвали за попытку, затем покажи правильный вариант и объясни ошибку ОДНИМ коротким предложением на русском.
- Поддерживай диалог в рамках выбранной темы или свободного общения, задавай встречные вопросы.
- Никогда не критикуй резко, будь тёплым и поддерживающим.`
      : `Ты — дружелюбный, терпеливый преподаватель английского языка, пингвин по имени Mr. Penguin. Ученик имеет уровень ${state.level||"A1"} по CEFR. Правила:
- Отвечай в основном на английском, адаптируя сложность речи под уровень ${state.level||"A1"}.
- Если ученик допускает ошибку (грамматика/лексика), мягко поправь: сначала кратко похвали за попытку, затем покажи правильный вариант и объясни ошибку ОДНИМ коротким предложением (можно на русском, если уровень A1-A2).
- Поддерживай диалог, задавай встречные вопросы по теме.
- Никогда не критикуй резко, будь тёплым и поддерживающим.`;
    const turns = log.map(m=>({role:m.role, content:m.content}));

    const replyText = await geminiGenerate(instructions, turns);
    thinkingEl.innerHTML = `<div class="msg-meta">🐧 MR. PENGUIN</div>${escHtml(replyText)}`; chatLog.scrollTop = chatLog.scrollHeight;
    log.push({role:"assistant", content:replyText, id:newMsgId()});
    // 16-turn history cap: re-applied here (in addition to the trim near the
    // top of this function, which only accounts for the user's own message)
    // since without this the log could grow to 17 once the AI's reply is
    // pushed on top of an already-full history.
    if(log.length>16) log.splice(0, log.length-16);
    addXP(5); saveState();
  }catch(e){
    thinkingEl.innerHTML = `<div class="msg-meta">🐧 MR. PENGUIN</div>${aiErrorMessage(e)}`;
  }
}

    ${ui.flashRevealed ? `<div class="rate-row">
        <button class="btn" data-rate="hard">Сложно</button>
        <button class="btn" data-rate="ok">Нормально</button>
        <button class="btn btn-primary" data-rate="easy">Легко</button>
      </div>` : ""}`;
  document.getElementById("flash-card").onclick=()=>{ ui.flashRevealed=true; renderReviewSession(); };
  main.querySelectorAll("[data-rate]").forEach(b=>{
    b.onclick=()=>{
      const intervals=[1,2,4,7,14];
      if(b.dataset.rate==="easy") word.box=Math.min(5,word.box+1);
      else if(b.dataset.rate==="hard") word.box=1;
      const days = intervals[word.box-1];
      const d=new Date(); d.setDate(d.getDate()+days);
      word.nextReview = d.toISOString().slice(0,10);
      addXP(5);
      ui.reviewIdx++; ui.flashRevealed=false;
      saveState(); renderReviewSession();
    };
  });
}

/* ============================================================
   ПРОГРЕСС (п.5.9 ТЗ): пройденные уроки/уровень (выше, на Главной, здесь —
   счётчики), динамика ошибок, % усвоения по темам (в т.ч. грамматики),
   время занятий, еженедельный/месячный отчёт.
============================================================ */
function formatStudyTime(min){
  const total = Math.round(min||0);
  if(total < 60) return `${total} мин`;
  const h = Math.floor(total/60), m = total%60;
  return `${h} ч${m?` ${m} мин`:""}`;
}
// Типы упражнений банка (п.5.7 ТЗ) сгруппированы по теме — "mcq"/"fill"
// в этом банке заданий именно грамматические (выбор формы глагола и т.п.),
// поэтому вместе дают "% усвоения грамматики" (п.5.9 ТЗ).
const SKILL_LABELS = { mcq:"Грамматика", fill:"Грамматика", translate:"Письмо", match:"Лексика", listen:"Аудирование", reading:"Чтение", pronounce:"Произношение" };
function aggregateSkillStats(){
  const agg = {};
  Object.keys(state.skillStats||{}).forEach(type=>{
    const label = SKILL_LABELS[type] || type;
    if(!agg[label]) agg[label] = {correct:0, total:0};
    agg[label].correct += state.skillStats[type].correct;
    agg[label].total += state.skillStats[type].total;
  });
  return agg;
}
function computeProgressReport(days){
  const cutoff = new Date(Date.now() - (days-1)*86400000).toISOString().slice(0,10);
  const lessonsInPeriod = Object.values(state.lessonsProgress).filter(l=>l.lastCompletedAt && l.lastCompletedAt>=cutoff).length;
  let xpInPeriod = 0;
  Object.keys(state.dailyXp||{}).forEach(d=>{ if(d>=cutoff) xpInPeriod += state.dailyXp[d]; });
  const errorsInPeriod = state.errorsLog.filter(e=>e.date>=cutoff).length;
  const vocabInPeriod = state.vocab.filter(v=>v.dateAdded && v.dateAdded>=cutoff).length;
  return {lessonsInPeriod, xpInPeriod, errorsInPeriod, vocabInPeriod};
}
function viewProgress(){
  const doneCount = Object.values(state.lessonsProgress).filter(l=>l.status==="done").length;
  const attempts = Object.values(state.lessonsProgress).reduce((s,l)=>s+(l.attempts||0),0);
  const days = [];
  for(let i=27;i>=0;i--){ const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10); days.push(d); }

  // Динамика ошибок за последние 14 дней (столбчатый тренд, не просто список).
  const errDays = [];
  for(let i=13;i>=0;i--){ errDays.push(new Date(Date.now()-i*86400000).toISOString().slice(0,10)); }
  const errCounts = errDays.map(d=>state.errorsLog.filter(e=>e.date===d).length);
  const maxErr = Math.max(1, ...errCounts);

  const skillAgg = aggregateSkillStats();
  const skillLabelsPresent = Object.keys(skillAgg).filter(l=>skillAgg[l].total>0);
  // "Грамматика" — явно названный в ТЗ показатель — всегда идёт первой строкой.
  skillLabelsPresent.sort((a,b)=> a==="Грамматика" ? -1 : b==="Грамматика" ? 1 : a.localeCompare(b));

  const reportDays = ui.progressReportDays===30 ? 30 : 7;
  const report = computeProgressReport(reportDays);

  return `
    <div class="page-head"><div class="eyebrow">${t('navProgress').toUpperCase()}</div><h1>Прогресс и статистика</h1></div>
    <div class="stat-row">
      <div class="stat-chip"><div class="num">${doneCount}/${LESSONS.length}</div><div class="lbl">уроков пройдено</div></div>
      <div class="stat-chip"><div class="num">${attempts}</div><div class="lbl">попыток всего</div></div>
      <div class="stat-chip"><div class="num">${state.vocab.length}</div><div class="lbl">слов в словаре</div></div>
      <div class="stat-chip"><div class="num">${state.xp}</div><div class="lbl">XP всего</div></div>
      <div class="stat-chip"><div class="num">${state.streak.count}</div><div class="lbl">${t('streakUnit')}</div></div>
      <div class="stat-chip"><div class="num">${formatStudyTime(state.studyMinutes)}</div><div class="lbl">время занятий</div></div>
    </div>
    <div class="card">
      <div class="eyebrow">АКТИВНОСТЬ ЗА 28 ДНЕЙ</div>
      <div class="cal-grid">${days.map(d=>`<div class="cal-cell ${state.activity[d]?'on':''}" title="${d}"></div>`).join("")}</div>
    </div>
    <div class="card">
      <div class="eyebrow">% УСВОЕНИЯ ПО ТЕМАМ</div>
      ${skillLabelsPresent.length===0 ? `<p style="color:var(--muted);margin-top:6px;">Пока нет данных — пройдите несколько упражнений в уроках.</p>` :
        skillLabelsPresent.map(label=>{
          const s = skillAgg[label];
          const pct = Math.round((s.correct/s.total)*100);
          return `<div class="skill-row">
            <span>${label}</span>
            <div class="skill-bar-track"><div class="skill-bar-fill" style="width:${pct}%;"></div></div>
            <span style="color:var(--muted);flex:none;">${pct}% (${s.correct}/${s.total})</span>
          </div>`;
        }).join("")}
    </div>
    <div class="card">
      <div class="eyebrow">ДИНАМИКА ОШИБОК ЗА 14 ДНЕЙ</div>
      ${state.errorsLog.length===0 ? `<p style="color:var(--muted);margin-top:6px;">Пока не зафиксировано — так держать!</p>` : `
      <div class="trend-row">${errCounts.map((c,i)=>`<div class="trend-bar ${c===0?'empty':''}" style="height:${Math.max(6,Math.round(c/maxErr*100))}%;" title="${errDays[i]}: ${c} ошиб."></div>`).join("")}</div>
      <p style="color:var(--muted);font-size:12px;margin-top:6px;">Ниже — детали последних ошибок и переход к повторению проблемной темы:</p>
      <ul style="padding-left:0;list-style:none;margin:6px 0 0;">${state.errorsLog.slice(-5).reverse().map(e=>{
        const lsn = LESSONS.find(l=>l.id===e.lessonId);
        return `<li style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;flex-wrap:wrap;">
          <span>${e.date} — урок «${lsn?lsn.title:e.lessonId}» (${e.exType})</span>
          ${lsn ? `<button class="btn btn-sm" data-action="open-lesson" data-id="${lsn.id}">Повторить урок →</button>` : ""}
        </li>`;
      }).join("")}</ul>`}
    </div>
    <div class="card">
      <div class="eyebrow">ОТЧЁТ О ПРОГРЕССЕ</div>
      <div style="display:flex;gap:8px;margin:8px 0 12px;">
        <button class="btn btn-sm ${reportDays===7?'btn-primary':''}" data-action="set-report-range" data-days="7">За неделю</button>
        <button class="btn btn-sm ${reportDays===30?'btn-primary':''}" data-action="set-report-range" data-days="30">За месяц</button>
      </div>
      <div class="stat-row" style="margin-bottom:0;">
        <div class="stat-chip"><div class="num">${report.lessonsInPeriod}</div><div class="lbl">уроков завершено</div></div>
        <div class="stat-chip"><div class="num">${report.xpInPeriod}</div><div class="lbl">XP заработано</div></div>
        <div class="stat-chip"><div class="num">${report.vocabInPeriod}</div><div class="lbl">новых слов</div></div>
        <div class="stat-chip"><div class="num">${report.errorsInPeriod}</div><div class="lbl">ошибок</div></div>
      </div>

function bindProfileEvents(){
  const save = document.querySelector('[data-action="save-profile"]');
  if(save) save.onclick=()=>{
    const nameInput = document.getElementById("p-name");
    const ageInput = document.getElementById("p-age");
    nameInput.classList.remove("field-invalid"); ageInput.classList.remove("field-invalid");
    const nameVal = nameInput.value.trim();
    const ageVal = ageInput.value.trim();
    const ageNum = parseInt(ageVal, 10);
    if(!nameVal){ nameInput.classList.add("field-invalid"); toast("Введите имя"); return; }
    if(!ageVal || isNaN(ageNum) || ageNum<5 || ageNum>100){ ageInput.classList.add("field-invalid"); toast("Введите корректный возраст (от 5 до 100)"); return; }
    state.profile.name = nameVal;
    state.profile.age = ageVal;
    state.profile.goal = document.getElementById("p-goal").value;
    const weeklyVal = parseInt(document.getElementById("p-weekly").value, 10);
    state.weeklyLessons = (weeklyVal>=1 && weeklyVal<=14) ? weeklyVal : (state.weeklyLessons||4);
    saveState(); toast("Профиль сохранён"); renderApp();
  };
  const langSel = document.getElementById("p-lang");
  if(langSel) langSel.onchange=()=>{ state.profile.interfaceLang = langSel.value; saveState(); renderApp(); };
  const tz = document.getElementById("p-tz");
  if(tz) tz.onchange=()=>{ state.profile.timezone = tz.value; saveState(); };
  const notif = document.getElementById("p-notif");
  if(notif) notif.onchange=()=>{
    state.profile.notifications = notif.checked; saveState();
    if(notif.checked && typeof Notification !== "undefined" && Notification.permission==="default"){
      Notification.requestPermission().then(()=>{ maybeShowStudyReminder(); });
    }
    toast(notif.checked?"Уведомления включены":"Уведомления выключены");
  };
  const themeSw = document.getElementById("p-theme");
  if(themeSw) themeSw.onchange=()=>{
    // checked = фирменная тёмная тема (по умолчанию); снято = светлая тема
    if(themeSw.checked){ document.documentElement.removeAttribute("data-theme"); }
    else{ document.documentElement.setAttribute("data-theme", "light"); }
    try{ localStorage.setItem("aitutor_theme", themeSw.checked?"":"light"); }catch(e){}
  };
  const reset = document.querySelector('[data-action="reset-progress"]');
  if(reset) reset.onclick=async ()=>{
    if(confirm("Точно сбросить весь прогресс? Это действие необратимо.")){
      // Сбрасываем именно содержимое состояния (сохраняя привязку к аккаунту),
      // а не просто локальный кэш — иначе после входа Supabase тут же вернул
      // бы старый прогресс с сервера поверх "сброшенного".
      const keepAccount = { userId: state.userId, userEmail: state.userEmail };
      state = Object.assign(defaultState(), keepAccount);
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      if(sbClient && state.userId){ clearTimeout(sbSyncTimer); await syncStateToSupabase(); }
      location.reload();
    }
  };
}

            <span style="color:var(--muted);flex:none;">${pct}% (${s.correct}/${s.total})</span></div>`;
        }).join("")}
    </div>`;

  return `
    <div class="page-head"><div class="eyebrow">${t('navAdmin').toUpperCase()}</div><h1>Панель администратора</h1>
      <p style="color:var(--muted);">Управление контентом, модерация диалогов ИИ и агрегированная статистика.</p>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn btn-sm ${tab==='content'?'btn-primary':''}" data-action="admin-tab" data-tab="content">Контент</button>
      <button class="btn btn-sm ${tab==='moderation'?'btn-primary':''}" data-action="admin-tab" data-tab="moderation">Модерация ${pending.length>0?`(${pending.length})`:""}</button>
      <button class="btn btn-sm ${tab==='stats'?'btn-primary':''}" data-action="admin-tab" data-tab="stats">Статистика</button>
    </div>
    ${tab==="content" ? contentTab : tab==="stats" ? statsTab : modTab}`;
}
